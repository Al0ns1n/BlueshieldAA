[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BlueshieldAA"
version = "0.1.0"
description = "A modular blue team cybersecurity toolkit for defense, monitoring and analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

keywords = ["cybersecurity", "blue team", "network", "security", "monitoring"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
traffic = ["scapy>=2.5"]
nmap = ["python-nmap>=0.7"]
all = ["scapy>=2.5", "python-nmap>=0.7"]

[project.urls]
Homepage = "https://github.com/AA/BlueshieldAA"
Repository = "https://github.com/AA/BlueshieldAA"
Issues = "https://github.com/AA/BlueshieldAA/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["blueshieldaa*"]
