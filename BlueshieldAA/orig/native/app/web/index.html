<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlueShieldAA</title>
<style>
/*FONTS*/
:root{
  --bg:#f1f3f8;--card:#fff;--stroke:#e2e6ef;--stroke-2:#cdd5e4;--hover:#f5f7fb;
  --text:#1c2640;--text-2:#44506c;--text-3:#6a7590;--text-4:#9aa3b8;
  --navy:#2e3a59;--navy-2:#27324d;
  --accent:#2f7de1;--accent-bg:#e8f1fd;--accent-ink:#1b5fbd;--cyan:var(--accent);
  --bar:#46618f;
  --red:#d92d20;--red-bg:#fdeceb;--red-ink:#b42318;
  --amber:#b7791f;--amber-bg:#fdf3dc;--amber-ink:#8a5a0a;
  --green:#12a06b;--green-bg:#e3f6ee;--green-ink:#0b7a52;
  --blue-bg:#e8f1fd;--blue-ink:#1b5fbd;
  --vio:#6a4fd8;--vio-bg:#eeeafc;--vio-ink:#4f37b8;
  --grey-bg:#eceff5;--grey-ink:#4a5572;
  --mono:"Cascadia Mono",Consolas,monospace;
  --field:#fff;--soft:#eef1f7;--soft-2:#f6f8fc;--head:#f8f9fc;--line:#edf0f6;--btn-hover:#f3f5fa;--warm:#fffaf0;--tick-b:#b3bdd2;--banner-b:#c6dbf7;--scroll:#c4ccdc;--titlebar:#fff;--icon:#3b4666;--shadow:rgba(30,45,90,.12);--group:#fbfcfe;--strong:#2b3658;--sel:#eaf1fc;--track:#e6eaf2;
  --muted:var(--text-3);--dim:var(--text-4);--ok:var(--green);--warn:var(--amber);--bad:var(--red);--sky:var(--accent)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--text);font:13px/1.45 Inter,"Segoe UI",system-ui,sans-serif;overflow:clip;user-select:none;-webkit-font-smoothing:antialiased}
body{background:var(--bg)}
button{font:inherit;color:inherit}
.ic{display:inline-flex;font-style:normal;line-height:1}.ic svg{width:1em;height:1em}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:#aab4c9}::-webkit-scrollbar-track{background:transparent}
.disp{font-family:Inter,sans-serif}

/* ---------- ventana: barra de título + carcasa ---------- */
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.titlebar{height:32px;flex:none;display:flex;align-items:center;background:var(--titlebar);color:var(--text);font-size:12px;padding-left:12px;gap:9px}
.titlebar .ti{font-size:15px;color:var(--strong)}
.titlebar .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption{display:flex;height:100%;flex:none}
.caption button{all:unset;width:46px;height:100%;display:grid;place-items:center;cursor:default;color:var(--text)}
.caption button:hover{background:var(--btn-hover)}
.caption button.cl:hover{background:#e81123;color:#fff}
.caption svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.1}
.caption .rs{display:none}body.max .caption .rs{display:block}body.max .caption .mx{display:none}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:254px minmax(0,1fr)}

/* ---------- barra lateral ---------- */
.side{background:var(--navy);display:flex;flex-direction:column;min-height:0;color:#cdd5e6}
.brand{display:flex;align-items:center;gap:12px;padding:20px 22px 16px;font:700 21px/1 Inter,sans-serif;color:#fff;letter-spacing:-.3px;flex:none}
.brand img{width:34px;height:34px;object-fit:contain}
.tabs{flex:1;min-height:0;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:3px}
.tabs::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.14)}
.tab{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;gap:14px;min-height:40px;padding:0 14px;border-radius:8px;color:#cdd5e6;cursor:pointer;font-size:14.5px;font-weight:500;transition:background .12s,color .12s;flex:none}
.tab>.ic:first-child{font-size:19px;flex:none;color:#b3bed7}
.tab .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:rgba(255,255,255,.06);color:#fff}
.tab.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.tab.on>.ic:first-child,.tab:hover>.ic:first-child{color:#fff}
.tab.on::before{content:"";position:absolute;left:-2px;top:8px;bottom:8px;width:3px;border-radius:2px;background:#d63a43}
.tab .chev{font-size:15px;opacity:.65;transition:transform .15s}
.tab.open .chev{transform:rotate(180deg)}
.tab.grp.has-on{color:#fff}.tab.grp.has-on>.ic:first-child{color:#fff}
.tabsub{display:none;flex-direction:column;gap:2px;margin:1px 0 5px}
.tabsub.open{display:flex}
.subtab{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;gap:8px;min-height:34px;padding:0 14px 0 47px;border-radius:8px;color:#a9b5d0;cursor:pointer;font-size:13.5px;font-weight:500;flex:none}
.subtab:hover{background:rgba(255,255,255,.05);color:#fff}
.subtab.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.subtab.on::before{content:"";position:absolute;left:-2px;top:7px;bottom:7px;width:3px;border-radius:2px;background:#d63a43}
.nb{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#d92d20;color:#fff;font:700 11px/20px Inter,sans-serif;text-align:center;white-space:nowrap;flex:none}
.nb.v{background:#7a5af8}
.me{display:flex;align-items:center;gap:11px;margin:6px 16px 0;padding:14px 4px 14px 6px;border-top:1px solid rgba(255,255,255,.09);flex:none;cursor:pointer}
.me .av2{width:36px;height:36px;border-radius:50%;background:#46659a;color:#fff;font:700 13px Inter,sans-serif;display:grid;place-items:center;flex:none}
.me .who{min-width:0;flex:1}
.me .who b{display:block;color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{display:block;color:#8e9ab6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{all:unset;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:#aeb9d1;cursor:pointer;font-size:19px;flex:none}
.rb:hover,.rb.on{background:rgba(255,255,255,.1);color:#fff}

/* ---------- cabecera ---------- */
.main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;height:64px;flex:none;padding:0 24px 0 28px;background:var(--field);border-bottom:1px solid var(--stroke)}
.top .ttl{min-width:0;flex:1}
.top h1{margin:0;font:700 19px/1.2 Inter,sans-serif;letter-spacing:-.2px;white-space:nowrap}
.top .s{color:var(--text-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.av-btn{width:36px;height:36px;border-radius:9px;background:var(--field);border:1px solid var(--stroke);display:grid;place-items:center;color:var(--icon);cursor:pointer;position:relative;font-size:18px;flex:none;transition:background .12s,border-color .12s}
.av-btn:hover{background:var(--btn-hover);border-color:var(--stroke-2)}
.av-btn:disabled{opacity:.45;pointer-events:none}
.av-btn .d{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#d92d20;border:2px solid var(--field);display:none;box-sizing:content-box;margin:-2px}
.cmd{position:relative;display:flex;align-items:center;gap:9px;width:36px;height:36px;border-radius:9px;background:var(--field);border:1px solid var(--stroke);padding:0 9px;color:var(--icon);cursor:pointer;flex:none;transition:width .18s ease,border-color .15s,box-shadow .15s}
.cmd .ic{font-size:17px;flex:none}
.cmd input{all:unset;flex:1;min-width:0;opacity:0;color:var(--text);font-size:13px}
.cmd input::placeholder{color:var(--text-4)}
.cmd kbd{display:none;font:600 11px Inter;border:1px solid var(--stroke-2);border-radius:5px;padding:1px 6px;color:var(--text-3);background:var(--soft-2)}
.cmd:focus-within,.pnl .cmd{width:330px;cursor:text}
.cmd:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,125,225,.14)}
.cmd:focus-within input,.pnl .cmd input{opacity:1}
.cmd:focus-within kbd{display:inline-block}
.pal{position:absolute;right:-1px;top:44px;width:400px;background:var(--field);border:1px solid var(--stroke);border-radius:12px;padding:6px;display:none;z-index:40;box-shadow:0 18px 50px -12px rgba(25,40,80,.28);max-height:420px;overflow:auto;cursor:default}
.pal.on{display:block}
.pal .g{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-4);padding:8px 10px 4px}
.pal .o{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text);cursor:pointer}
.pal .o .ic{font-size:15px;color:var(--text-3)}
.pal .o small{margin-left:auto;color:var(--text-4);font-size:11.5px}
.pal .o.on{background:var(--accent-bg)}.pal .o.on .ic{color:var(--accent)}
.rz{position:fixed;z-index:30}
.rz.t{top:0;left:8px;right:8px;height:4px;cursor:ns-resize}.rz.b{bottom:0;left:8px;right:8px;height:5px;cursor:ns-resize}
.rz.l{left:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}.rz.r{right:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
.rz.tl{top:0;left:0;width:9px;height:9px;cursor:nwse-resize}.rz.br{bottom:0;right:0;width:9px;height:9px;cursor:nwse-resize}
.rz.tr{top:0;right:0;width:9px;height:9px;cursor:nesw-resize}.rz.bl{bottom:0;left:0;width:9px;height:9px;cursor:nesw-resize}
body.max .rz{display:none}

/* ---------- páginas ---------- */
.pages{flex:1;min-height:0;position:relative}
.page{position:absolute;inset:0;display:none;overflow:auto;padding:24px 28px 18px}
.page.on{display:block;animation:fade .2s ease}
.page.fill{flex-direction:column;overflow:hidden}.page.fill.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:center;gap:12px;margin:0 0 16px;flex:none}
.phead .grow{flex:1;min-width:0}.phead h1,.phead .sub{display:none}
.phead:not(:has(.btn,.lsearch)){display:none}
.subtabs{display:none}
.card{border-radius:10px;background:var(--card);border:1px solid var(--stroke);padding:20px;contain:layout paint;position:relative;overflow:hidden}
.card h3{margin:0 0 4px;font:700 14px/1.3 Inter,sans-serif;color:var(--text)}
.card .s{color:var(--text-3);font-size:12.5px}
.k{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-2);display:flex;align-items:center;gap:8px}
.btn{height:34px;border-radius:8px;border:1px solid var(--stroke-2);padding:0 14px;font:600 12.5px Inter,sans-serif;background:var(--field);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--btn-hover);border-color:#b9c3d8}
.btn.pri{border-color:var(--navy);color:#fff;background:var(--navy)}.btn.pri:hover{background:#3a4a70;border-color:#3a4a70}
.btn.dark{background:var(--field)}
.btn.danger{background:var(--red-bg);border-color:color-mix(in srgb,var(--red) 35%,transparent);color:var(--red-ink)}.btn.danger:hover{background:var(--red-bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-ink);padding:0 8px}.btn.ghost:hover{background:var(--accent-bg)}
.btn.sm{height:30px;padding:0 12px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .ic{font-size:15px}
.lnk{color:var(--accent-ink);font-weight:600;cursor:pointer;background:none;border:0;padding:0;font-size:12.5px;white-space:nowrap}.lnk:hover{text-decoration:underline}

/* ---------- dashboard ---------- */
.dash{display:flex;flex-direction:column;gap:16px}
.banner{display:none;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--banner-b);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font-size:13px}
.banner b{color:var(--text)}.banner .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kt{padding:20px 22px 18px;cursor:pointer;transition:border-color .12s,box-shadow .12s;contain:none}
.kt:hover{border-color:var(--stroke-2);box-shadow:0 3px 10px rgba(30,45,90,.07)}
.kt .k{margin-bottom:8px}
.kt .big{font:700 34px/1.1 Inter,sans-serif;letter-spacing:-.6px;color:var(--strong);font-variant-numeric:tabular-nums}
.kt .big small{font:600 15px Inter,sans-serif;color:var(--text-3);letter-spacing:0;margin-left:5px}
.kt .d{margin-top:3px;color:var(--text-3);font-size:13px}
.kt.warn .big{color:var(--amber)}.kt.bad .big{color:var(--red)}.kt.good .big{color:var(--green)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.dtri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ct{margin:0;font:700 14px/1.3 Inter,sans-serif;color:var(--text)}
.cs{margin:1px 0 12px;color:var(--text-3);font-size:12.5px}
.ch{display:flex;align-items:flex-start;gap:10px}.ch .grow{flex:1;min-width:0}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:14px;height:300px;margin-top:6px}
.bc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.bc .bv{font:700 12.5px Inter,sans-serif;color:var(--text);font-variant-numeric:tabular-nums}
.bc i{display:block;width:min(40px,72%);background:var(--bar);border-radius:5px 5px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bc .bx{font:600 12px Inter,sans-serif;color:var(--text-3);margin-top:6px;white-space:nowrap}
.bc.cur i{background:var(--accent)}
.empty-c{height:260px;display:grid;place-items:center;text-align:center;color:var(--text-3);font-size:13px;padding:0 24px}
.chips-f{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chips-f .bk{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 11px;cursor:pointer;border:1px solid color-mix(in srgb,currentColor 26%,transparent);background:color-mix(in srgb,currentColor 9%,transparent)}
.chips-f .bk:hover{background:color-mix(in srgb,currentColor 15%,transparent)}
.chips-f .bk .pt{font-variant-numeric:tabular-nums;opacity:.8}
.dn{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:6px}
.dn .ring{position:relative;width:176px;height:176px;flex:none}
.dn .ring svg{display:block;width:100%;height:100%}
.dn .ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dn .ring b{font:700 34px/1 Inter,sans-serif;color:var(--strong);letter-spacing:-.6px}
.dn .ring span{color:var(--text-3);font-size:12.5px;margin-top:3px}
.lg{width:100%;display:flex;flex-direction:column;gap:8px}
.lg div{display:grid;grid-template-columns:12px minmax(0,1fr) auto 46px;align-items:center;gap:10px;font-size:13px;color:var(--text-2);cursor:default}
.lg div[onclick]{cursor:pointer}.lg div[onclick]:hover span{color:var(--text)}
.lg i{width:12px;height:12px;border-radius:3px;display:block}
.lg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg em{font-style:normal;font-weight:600;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.lg b{font-weight:500;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums}
.ul{display:flex;flex-direction:column;gap:3px}
.ur{display:grid;grid-template-columns:20px minmax(0,1fr) auto 72px;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.ur[onclick]{cursor:pointer}.ur[onclick]:hover .un{color:var(--text)}
.ur .ui{font-size:18px;color:#7b86a0}
.ur .un{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);font-weight:500}
.ur .up{text-align:right;font:600 12.5px var(--mono);color:var(--text-2);min-width:58px}
.ur .ub{height:6px;border-radius:4px;background:var(--track);overflow:hidden}.ur .ub b{display:block;height:100%;border-radius:4px}
.sr{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--text-2);cursor:pointer}
.sr:first-child{border-top:0}.sr:hover{color:var(--text)}
.sr .ic{font-size:17px}.sr .ok{color:var(--green)}.sr .wr{color:var(--amber)}.sr .bd{color:var(--red)}.sr .nt{color:var(--text-4)}
.sr b{font-weight:600;color:var(--text)}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li:hover b{color:var(--accent-ink)}
.li .n{flex:1;min-width:0}.li .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .n span{color:var(--text-3);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip2{font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.rec{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.rec:first-child{border-top:0}
.rec:hover .rt b{color:var(--accent-ink)}
.rec .ri{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent-ink);flex:none;font-size:16px}
.rec .rt{flex:1;min-width:0}
.rec .rt b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .rt span{display:block;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .go{color:var(--accent-ink);font-weight:600;font-size:11.5px;flex:none}
.empty2{color:var(--green-ink);font-size:13px;padding:12px 0;display:flex;align-items:center;gap:8px}
.tl div{display:flex;gap:10px;font-size:12.5px;padding:7px 0;color:var(--text-2);align-items:flex-start;border-top:1px solid var(--line)}
.tl div:first-child{border-top:0}
.tl em{font-style:normal;color:var(--text-3);width:42px;flex:none;font-variant-numeric:tabular-nums}
.tl span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotl{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.clickable{cursor:pointer;transition:border-color .15s}.clickable:hover{border-color:var(--stroke-2)}
.more{margin-top:8px;display:inline-block}

/* ---------- tablas ---------- */
.tbl{width:100%}
.thead,.tr{display:grid;grid-template-columns:var(--cols);align-items:center}
.thead>div,.tr>div{padding:0 10px;min-width:0}
.thead{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--stroke);background:var(--head)}
.thead>div{padding-top:10px;padding-bottom:10px}
.tr{border-bottom:1px solid var(--line);min-height:54px;cursor:pointer;transition:background .1s;content-visibility:auto;contain-intrinsic-size:auto 54px}
.tr:hover{background:var(--hover)}
.tr.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.tr.exp{box-shadow:inset 3px 0 0 var(--red)}
.grouphd{display:flex;align-items:center;gap:10px;padding:14px 10px 8px;border-bottom:1px solid var(--line);background:var(--group)}
.grouphd b{font-size:12.5px;font-weight:700;letter-spacing:.1px;color:var(--text)}
.grouphd .gi{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;background:var(--soft)}
.grouphd .gi .ic{font-size:13px}
.grouphd .gc{font-size:10.5px;font-weight:600;color:var(--text-3);background:var(--soft);border-radius:999px;padding:2px 8px}
.grouphd .gcv{color:var(--red-ink);background:var(--red-bg)}
.cellmuted{color:var(--text-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vers{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ap{display:flex;align-items:center;gap:10px;min-width:0}
.ap .av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font:700 13px Inter,sans-serif;flex:none}
.av.img{background:var(--field);box-shadow:inset 0 0 0 1px var(--stroke);overflow:hidden}
.av.img img{width:100%;height:100%;object-fit:contain;display:block;padding:3px}
.ap .av .ic{font-size:16px}
.ap .t{min-width:0}.ap b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap small{display:block;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.3px;border-radius:999px;padding:3px 11px 3px 9px;white-space:nowrap;border:1px solid color-mix(in srgb,currentColor 22%,transparent);background:color-mix(in srgb,currentColor 9%,transparent)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.2px;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid color-mix(in srgb,currentColor 22%,transparent);background:color-mix(in srgb,currentColor 9%,transparent);color:var(--grey-ink)}
.tag .ic{font-size:11px}
.tg-crit{color:#b42318}.tg-high{color:#b54708}.tg-med{color:var(--amber-ink)}
.tg-need{color:var(--blue-ink)}.tg-rem{color:var(--green-ink)}.tg-opt{color:var(--grey-ink)}
.fire{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap;background:var(--red-bg);color:var(--red-ink)}
.fire::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.conf{display:inline-flex;align-items:center;gap:5px;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.3px;border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--red-ink);border:1px solid color-mix(in srgb,var(--red) 35%,transparent);background:var(--red-bg)}
.conf::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--red)}
.tick{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--tick-b);background:var(--field);display:grid;place-items:center;transition:all .1s}
.tick .ic{font-size:11px;color:#fff;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}.tick.on .ic{opacity:1}
.tick.off{opacity:.25;pointer-events:none}

/* ---------- lista + detalle ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;flex:1;min-height:0}
.listcard{display:flex;flex-direction:column;min-height:0;padding:0}
.ltools{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--stroke);flex-wrap:wrap}
.ltools .sp{flex:1}
.lsearch{display:flex;align-items:center;gap:8px;height:32px;border-radius:8px;background:var(--field);border:1px solid var(--stroke-2);padding:0 8px 0 10px;color:var(--text-3);min-width:180px;max-width:280px;transition:border-color .12s,box-shadow .12s}
.lsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,125,225,.14)}
.lsearch .ic{font-size:14px;flex:none}
.lsearch input{background:none;border:0;outline:0;color:var(--text);font:500 12.5px Inter,sans-serif;width:100%;min-width:0}
.lsearch input::placeholder{color:var(--text-4)}
.lsearch .lsx{background:none;border:0;color:var(--text-3);cursor:pointer;font-size:17px;line-height:1;padding:0 2px;display:none}
.lsearch .lsx:hover{color:var(--text)}
.lsearch.has .lsx{display:block}
.chips{display:flex;gap:2px;background:var(--soft);border-radius:9px;padding:3px;overflow-x:auto;max-width:100%}
.chip{border:0;background:transparent;color:var(--text-2);border-radius:7px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.on{background:var(--field);color:var(--text);box-shadow:0 1px 2px var(--shadow)}
.chip .n{color:var(--text-3);margin-left:5px;font-weight:500}
.list{flex:1;overflow:auto}
.list .thead{position:sticky;top:0;z-index:1;background:var(--head)}
.empty{color:var(--text-3);padding:30px 20px;text-align:center}
.detail{display:flex;flex-direction:column;min-height:0}
.detail .ph{margin:auto;text-align:center;color:var(--text-4);font-size:12.5px}
.detail .ph .ic{display:block;font-size:30px;margin:0 auto 10px;opacity:.7}
.dh{display:flex;align-items:center;gap:12px}
.dh .av{width:44px;height:44px;border-radius:12px;font-size:17px}
.detail h2{font:700 17px/1.3 Inter,sans-serif;margin:0;word-break:break-word}
.detail .meta{color:var(--text-3);font-size:12px;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;padding:12px 14px;border-radius:10px;background:var(--soft-2);border:1px solid var(--stroke)}
.kv small{display:block;color:var(--text-3);font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.kv div div{margin-top:4px;font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
.dtext{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text-2);line-height:1.6;overflow-y:auto;flex:1;user-select:text;font-size:12.5px}
.links a{display:inline-block;margin:6px 8px 0 0;color:var(--accent-ink);cursor:pointer;font-size:12px;font-weight:600}
.dacts{display:flex;flex-direction:column;gap:8px;margin-top:14px}.dacts .btn{width:100%}

/* ---------- tráfico de red ---------- */
#p-traffic{--tcols:minmax(0,1.5fr) 88px minmax(0,2.3fr) 1.1fr 1fr}
.tstats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:16px;flex:none}
.tstat{background:var(--field);border:1px solid var(--stroke);border-radius:10px;padding:14px 16px}
.tstat small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-2)}
.tstat b{display:block;font:700 23px/1.1 Inter,sans-serif;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--strong)}
.trhd{display:grid;grid-template-columns:var(--tcols);padding:11px 12px;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--stroke);background:var(--head)}
.trhd>div{padding:0 6px}
.trr{display:grid;grid-template-columns:var(--tcols);align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;content-visibility:auto;contain-intrinsic-size:auto 37px}
.trr>div{min-width:0;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trr:hover{background:var(--hover)}
.trr.risk{background:var(--field)af0;box-shadow:inset 3px 0 0 var(--amber)}
.trr .pc{display:flex;align-items:center;gap:8px;min-width:0}
.trr .pc b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.trr .dot{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}
.trr .scope{font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.trr .host{color:var(--text)}.trr .ip{color:var(--text-3);font-variant-numeric:tabular-nums}
.tanalysis{flex:none;margin-bottom:16px}
.tan-ok{display:flex;align-items:center;gap:10px;background:var(--green-bg);border:1px solid #bfe8d6;border-radius:10px;padding:12px 14px;color:var(--green-ink);font-size:13px;font-weight:600}
.tan-hd{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--amber-ink);margin-bottom:9px}
.tan-hd .ic{color:var(--amber)}
.tan-card{background:var(--field)af0;border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:10px;padding:12px 14px}
.tan-card.crit{background:var(--field)5f4;border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.tan-card.crit .tan-hd{color:var(--red-ink)}.tan-card.crit .tan-hd .ic{color:var(--red)}
.tan-item{display:flex;gap:10px;padding:8px 0;border-top:1px solid rgba(0,0,0,.06);cursor:pointer}
.tan-item:first-child{border-top:0}
.tan-item .tdot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:currentColor}
.tan-item .ti{flex:1;min-width:0}
.tan-item .ti b{display:block;font-size:12.5px;color:var(--text)}
.tan-item .ti .d{color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 3px}
.tan-item .ti .w{color:var(--text-2);font-size:12px;line-height:1.5}

/* ---------- ajustes, registro ---------- */
.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.settings .full{grid-column:1/-1}
.settings .card h3{margin-bottom:10px}
.help{color:var(--text-3);margin:0;font-size:12.5px}
.sw{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--line)}.sw:last-child{border:0}
.sw .track{width:36px;height:20px;border-radius:10px;background:#c9d1e1;position:relative;flex:none;margin-top:1px;transition:background .15s}
.sw .track::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:all .16s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on .track{background:var(--accent)}.sw.on .track::after{left:18px}
.sw b{font-weight:600}.sw small{display:block;color:var(--text-3);font-size:12px;margin-top:2px}
.projects div{display:flex;align-items:center;gap:10px;background:var(--soft-2);border:1px solid var(--stroke);border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:12.5px}
.projects div span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projects button{all:unset;cursor:pointer;color:var(--text-4);display:inline-flex}.projects button:hover{color:var(--red)}
.field label{display:block;color:var(--text-2);font-size:12px;font-weight:600;margin:12px 0 6px}
.field textarea,.field input{width:100%;background:var(--field);border:1px solid var(--stroke-2);border-radius:8px;color:var(--text);padding:9px 12px;font:13px Inter,sans-serif;resize:vertical;user-select:text;outline:none}
.field textarea:focus,.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,125,225,.14)}
.field input::placeholder,.field textarea::placeholder{color:var(--text-4)}
.listin{display:flex;gap:8px;margin-top:8px}.listin input{flex:1}
.kvline{display:flex;gap:8px;align-items:center;color:var(--text-3);font-size:12px;margin-top:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 14px;cursor:pointer;color:var(--text-2);font-weight:600;font-size:12.5px}
.seg button.on{background:var(--field);color:var(--text);box-shadow:0 1px 2px rgba(30,45,90,.12)}
.checks div{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.checks .ic{font-size:14px;margin-top:1px}
.log{flex:1;min-height:0;background:#131b2f;border:1px solid #1f2a45;border-radius:10px;overflow:auto;padding:16px 18px;font:12px/1.7 var(--mono);user-select:text;color:#cbd5e1}
.log div{white-space:pre-wrap;word-break:break-word}
.l-ok{color:#6ee7b7}.l-warn{color:#fcd34d}.l-err{color:#fda4af}.l-cmd{color:#67e8f9}.l-out{color:#8a96b0}.l-title{color:#c4b5fd}.l-info{color:#cbd5e1}

/* ---------- estado y diálogos ---------- */
.status{display:flex;align-items:center;gap:16px;height:30px;padding:0 28px;flex:none;background:var(--field);border-top:1px solid var(--stroke)}
.status span{flex:1;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{width:240px;height:4px;border-radius:4px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .4s}
.pbar.ind i{width:35%;animation:ind 1.2s ease-in-out infinite}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
.modal{position:fixed;inset:0;background:rgba(24,33,58,.45);backdrop-filter:blur(2px);display:none;place-items:center;z-index:50}
.modal.on{display:grid;animation:fade .14s}
.dialog{width:520px;max-height:80vh;display:flex;flex-direction:column;background:var(--field);border:1px solid var(--stroke);border-radius:14px;padding:24px;box-shadow:0 30px 80px -20px rgba(20,30,60,.45)}
.dialog h2{margin:0 0 6px;font:700 18px Inter,sans-serif}
.dialog .body{overflow:auto;color:var(--text-2);margin:8px 0 20px;font-size:13px}
.dialog ul{margin:6px 0;padding-left:18px}.dialog li{margin:3px 0}
.dialog code{background:var(--soft);border-radius:4px;padding:1px 5px;font:12px var(--mono)}
.dialog .warn{background:var(--amber-bg);color:var(--amber-ink);border-radius:10px;padding:10px 14px;margin-top:12px}
.dialog .acts{display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;right:24px;bottom:44px;background:#1f2a44;border:1px solid #33415f;color:#fff;border-radius:10px;padding:12px 16px;max-width:460px;display:none;z-index:60;box-shadow:0 16px 40px -12px rgba(15,25,55,.5);font-size:13px}
.toast.on{display:block;animation:fade .2s}

/* ---------- overlay de progreso con animación (heredado) ---------- */
/* overlay de progreso: aspecto y animaciones ORIGINALES (oscuro, cian) */
.scanfx,.scanner{--text:#e8ecf4;--text-2:#b4bfd6;--text-3:#7f8aa3;--cyan:#22d3ee;color:#e8ecf4}
.scanfx{position:absolute;inset:0;z-index:18;display:none;align-items:center;justify-content:center;overflow:hidden;background:rgba(7,9,16,.82);backdrop-filter:blur(8px)}
.scanfx.on{display:flex;animation:fade .2s}
.scanfx.hidden{display:none}
#fxcanvas{position:absolute;inset:0;width:100%;height:100%}
.fxui{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px}
.fxring{position:relative;width:170px;height:170px}
.fxring svg{transform:rotate(-90deg);filter:drop-shadow(0 0 12px rgba(34,211,238,.5))}
.fxring circle{fill:none;stroke-width:5}.fxtrk{stroke:rgba(255,255,255,.08)}
.fxval{stroke:url(#gg);stroke-linecap:round;stroke-dasharray:0 440;transition:stroke-dasharray .4s ease}
.fxpct{position:absolute;inset:0;display:grid;place-content:center}
.fxpct b{font:800 46px "Inter Display",Inter;background:linear-gradient(180deg,#fff,#7dd3fc);-webkit-background-clip:text;color:transparent}
.fxpct span{color:var(--text-3);font-size:14px;margin-top:-4px}
.fxtitle{font:700 20px "Inter Display",Inter;letter-spacing:.3px}
.fxstatus{color:var(--cyan);font-size:13px;min-height:18px;font-family:var(--mono)}
.fxlog{height:66px;overflow:hidden;width:460px;max-width:80vw;font:11px/1.5 var(--mono);color:var(--text-3);mask-image:linear-gradient(transparent,#000 40%)}
.fxlog div{opacity:.6}.fxlog div:last-child{opacity:1;color:var(--text-2)}
#fxhide{margin-top:4px}


/* ---------- ventana de progreso (escáner cíber) ---------- */
.scanner{position:fixed;inset:0;z-index:45;display:none;overflow:hidden;background:radial-gradient(900px 600px at 50% 30%,rgba(34,211,238,.10),transparent 60%),rgba(6,8,13,.86);backdrop-filter:blur(10px)}
.scanner.on{display:flex;flex-direction:column;animation:fade .25s ease}
.scanner canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.scanner .veil{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.14) 2px 4px);pointer-events:none;mix-blend-mode:overlay}
.sc-top{position:relative;display:flex;align-items:center;gap:12px;padding:20px 26px}
.sc-top .tag{border:1px solid rgba(34,211,238,.4);color:#67e8f9;background:rgba(34,211,238,.08);letter-spacing:1.5px;text-transform:uppercase;font-size:11px}
.sc-top .mini{margin-left:auto}
.sc-mid{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
.radar{position:relative;width:300px;height:300px;flex:none}
.radar .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(34,211,238,.18)}
.radar .ring.r2{inset:34px}.radar .ring.r3{inset:72px}.radar .ring.r4{inset:112px}
.radar .cross::before,.radar .cross::after{content:"";position:absolute;background:rgba(34,211,238,.12)}
.radar .cross::before{left:50%;top:0;bottom:0;width:1px;transform:translateX(-.5px)}
.radar .cross::after{top:50%;left:0;right:0;height:1px;transform:translateY(-.5px)}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(34,211,238,.35),rgba(34,211,238,0) 55%);animation:sweep 2.6s linear infinite;mask:radial-gradient(circle,transparent 8px,#000 9px)}
@keyframes sweep{to{transform:rotate(360deg)}}
.radar .prog{position:absolute;inset:16px}
.radar .prog circle{transition:stroke-dasharray .5s ease}
.radar .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.radar .num b{font:800 56px/1 "Inter Display",Inter;letter-spacing:-2px;background:linear-gradient(180deg,#e8ffff,#67e8f9);-webkit-background-clip:text;color:transparent;text-shadow:0 0 26px rgba(34,211,238,.4)}
.radar .num span{display:block;color:#7fd7e4;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
/* ---------- escena isométrica (PC trabajando) ---------- */
.isostage{position:relative;width:min(560px,74vw);height:320px;display:flex;align-items:center;justify-content:center;flex:none}
.isoscene{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 22px 42px rgba(0,0,0,.55));animation:isobob 4.2s ease-in-out infinite}
.iso-floorglow{fill:rgba(34,211,238,.14);transform-box:fill-box;transform-origin:center;animation:floorpulse 2.6s ease-in-out infinite}
.plat-top{fill:#131c2e;stroke:rgba(34,211,238,.4);stroke-width:1}
.plat-l{fill:#0b111c}.plat-r{fill:#080d16}
.iso-grid{stroke:rgba(34,211,238,.16);stroke-width:1;fill:none}
.tower-top{fill:#223150}.tower-l{fill:#141d31}.tower-r{fill:#0f1626;stroke:rgba(34,211,238,.2);stroke-width:.6}
.led{filter:drop-shadow(0 0 5px currentColor)}
.led0{fill:#34d399;color:#34d399;animation:ledblink 1.3s infinite}
.led1{fill:#22d3ee;color:#22d3ee;animation:ledblink 1.3s infinite .32s}
.led2{fill:#a78bfa;color:#a78bfa;animation:ledblink 1.3s infinite .64s}
.base-top{fill:#223150}.base-l{fill:#141d31}.base-r{fill:#0f1626}
.stand-l{fill:#141d31}.stand-r{fill:#0f1626}
.mon-top{fill:#2a3c60}.mon-l{fill:#0f1626}.mon-r{fill:#0b111c}
.iso-screen{fill:url(#scrG);stroke:rgba(34,211,238,.55);stroke-width:1.2;animation:screenglow 2.3s ease-in-out infinite}
.codebar{stroke:#7dd3fc;stroke-width:2;stroke-linecap:round;opacity:.5;animation:cbpulse 1.8s ease-in-out infinite}
.codebar:nth-of-type(2n){animation-duration:2.4s;animation-delay:.3s}
.codebar:nth-of-type(3n){animation-delay:.7s;stroke:#a5f3fc}
.codebar:nth-of-type(4n){animation-duration:1.3s;animation-delay:.15s}
.iso-scanline{stroke:#dffaff;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 9px #22d3ee)}
.scanline-g{animation:scanup 1.9s linear infinite}
.cube-top{fill:#30456e}.cube-l{fill:#1b2a49}.cube-r{fill:#131f39;stroke:rgba(34,211,238,.28);stroke-width:.5}
.cube{filter:drop-shadow(0 0 7px rgba(34,211,238,.3))}
.c0{animation:cubefloat 2.6s ease-in-out infinite}
.c1{animation:cubefloat 3s ease-in-out infinite .4s}
.c2{animation:cubefloat 2.3s ease-in-out infinite .9s}
@keyframes isobob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes ledblink{0%,100%{opacity:.16}50%{opacity:1}}
@keyframes cubefloat{0%,100%{transform:translateY(3px);opacity:.4}50%{transform:translateY(-16px);opacity:1}}
@keyframes cbpulse{0%,100%{opacity:.16}50%{opacity:.95}}
@keyframes floorpulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
@keyframes screenglow{0%,100%{filter:drop-shadow(0 0 8px rgba(34,211,238,.25))}50%{filter:drop-shadow(0 0 20px rgba(34,211,238,.6))}}
@keyframes scanup{0%{transform:translateY(10px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(-66px);opacity:0}}
.isohud{position:absolute;right:2%;bottom:6%;width:104px;height:104px}
.isohud .isoring{width:104px;height:104px;display:block;overflow:visible}
.isohud .isoring circle{transition:stroke-dasharray .5s ease}
.isohud .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.isohud .num b{font:800 30px/1 "Inter Display",Inter;letter-spacing:-1px;background:linear-gradient(180deg,#e8ffff,#67e8f9);-webkit-background-clip:text;color:transparent;text-shadow:0 0 18px rgba(34,211,238,.4)}

  --bar:#5b7bb3;
  --red:#f0584e;--red-bg:#3a1b1e;--red-ink:#ff9d95;
  --amber:#e2a94c;--amber-bg:#352910;--amber-ink:#f5c771;
  --green:#2cc68c;--green-bg:#0f3328;--green-ink:#64e1b0;
  --blue-bg:#152847;--blue-ink:#93c0f8;

.tgh:first-child{margin-top:0}.tgh small{font-weight:600;margin-left:4px;color:var(--text-4)}

.lk-wrap{max-width:900px;gap:36px;padding-bottom:24px}

const CHIPS = [['pending','Pendientes'],['vuln','Graves'],['upd','Avisos'],['ok','Correcto'],['all','Todo']];
const CHIPS_UPD = [['pending','Por actualizar'],['exp','Explotadas'],['vuln','De seguridad'],['ok','Al día'],['all','Todo']];
const CHIPS_PENT = [['all','Todas'],['t:Crítica','Críticas'],['t:Alta','Altas'],['t:Media','Medias'],['t:Baja','Bajas'],['new','Nuevas'],['ok','Corregidas']];
const CHIPS_APPS = [['all','Todas'],['t:Prescindible','Prescindibles'],['t:Tú decides','Tú decides'],['t:Necesaria','Necesarias'],['upd','A revisar']];
function buildChips(){
  const list = S.page === 'apps' ? CHIPS_APPS : S.page === 'pentest' ? CHIPS_PENT : S.page === 'updates' ? CHIPS_UPD : CHIPS;
  const cats = PAGE_CATS[S.page] || [];
  const n = t => S.items.filter(i => cats.includes(i.category) && i.tag === t && i.status !== 'Al día').length;
  $('#chips').innerHTML = list.map(c => `<button class="chip ${S.chip===c[0]?'on':''}" data-c="${esc(c[0])}">${c[1]}${(S.page === 'apps' || S.page === 'pentest') && c[0].startsWith('t:') && S.lastScan ? `<span class="n">${n(c[0].slice(2))}</span>` : ''}</button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { S.chip = b.dataset.c; renderList(); });
  $('#chips').style.display = S.page === 'clean' ? 'none' : '';
  $('#bRec').textContent = S.page === 'apps' ? 'Marcar prescindibles' : S.page === 'pentest' ? 'Marcar corregibles' : S.page === 'updates' ? 'Marcar las recomendadas' : 'Marcar recomendados';
}
function subtabsHTML(p){
  const t = tabOf(p); if (!t || !t.sub) return '';
  const nch = S.items.filter(i => i.category === 'Cambios' && i.action === 'acceptchange' && PENDING.includes(i.status)).length;
  return `<div class="subtabs">${t.sub.map(s => `<button class="${s[0]===p?'on':''}" onclick="showPage('${s[0]}')">${s[1]}${s[0]==='changes'&&nch?`<span class="b">${nch}</span>`:''}</button>`).join('')}</div>`;
}

  if (!list.length) { $('#toolGrid').innerHTML = '<div class="empty" style="grid-column:1/-1;text-align:center;color:var(--text-3);padding:40px 0">No hay ninguna herramienta con ese nombre.</div>'; return; }
  // Con «Todas» y sin búsqueda, agrupadas por categoría
  if (toolCat === 'Todas' && !q) {
    $('#toolGrid').innerHTML = TOOL_CATS.slice(1).map(c => { const g = list.filter(([x]) => x.cat === c); return g.length ? `<h4 class="tgh">${esc(c)} <small>${g.length}</small></h4>${g.map(card).join('')}` : ''; }).join('');
  } else {
    $('#toolGrid').innerHTML = list.map(card).join('');
  }
}

/* ---------- Diagnóstico: monitorización del equipo al estilo Grafana ---------- */
const DG = { range: 300, pts: [], snap: null, live: true, timer: 0, hover: null, sort: 'c', charts: [], busy: false, lastFull: 0 };
const GC = { green:'#73bf69', yellow:'#fade2a', blue:'#5794f2', orange:'#ff9830', red:'#f2495c', purple:'#b877d9', cyan:'#8ab8ff', teal:'#33b5a5' };
const DRANGES = [[300,'5 min'],[900,'15 min'],[3600,'1 h'],[21600,'6 h']];

const fPct = v => v == null || v < 0 ? '–' : (v >= 10 ? Math.round(v) : v.toFixed(1)).toString().replace('.', ',') + ' %';
function fBytes(b){ b = b || 0; const u = ['B','KB','MB','GB','TB']; let i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; } return (i >= 3 ? b.toFixed(1) : i ? b.toFixed(b < 10 ? 1 : 0) : Math.round(b)).toString().replace('.', ',') + ' ' + u[i]; }
const fRate = b => fBytes(b) + '/s';
function fBits(B){ let b = (B || 0) * 8; const u = ['bit/s','kbit/s','Mbit/s','Gbit/s']; let i = 0; while (b >= 1000 && i < u.length - 1) { b /= 1000; i++; } return (b >= 100 || !i ? Math.round(b) : b.toFixed(1)).toString().replace('.', ',') + ' ' + u[i]; }
const fMs = v => (v >= 100 ? Math.round(v) : v.toFixed(1)).toString().replace('.', ',') + ' ms';
const fMHz = v => v >= 1000 ? (v / 1000).toFixed(2).replace('.', ',') + ' GHz' : Math.round(v) + ' MHz';

const thrCol = (v, w, b) => v >= b ? GC.red : v >= w ? GC.orange : GC.green;

  {id:'page', t:'Paginación', d:'páginas por segundo movidas entre RAM y disco', fmt: v => fNum(v) + ' /s', s:[{k:'pg', n:'Páginas/s', c:GC.red, fill:.15}]},

];

function diagInit(){
  document.querySelectorAll('#dgRange button').forEach(b => b.onclick = () => { DG.range = +b.dataset.r; DG.pts = []; diagMarkRange(); diagPoll(true); });
  $('#dgQ').oninput = () => diagTables();
  diagMarkRange(); diagPauseBtn();
  document.querySelectorAll('#dgGrid .dg-panel').forEach(el => {
    const cv = el.querySelector('canvas');
    cv.onmousemove = e => { const r = cv.getBoundingClientRect(); DG.hover = {x: (e.clientX - r.left) / r.width, id: el.dataset.p}; diagDraw(); };
    cv.onmouseleave = () => { DG.hover = null; diagDraw(); };
  });
  new ResizeObserver(() => diagDraw()).observe($('#dgGrid'));
}
function diagMarkRange(){ document.querySelectorAll('#dgRange button').forEach(b => b.classList.toggle('on', +b.dataset.r === DG.range)); }
function diagPauseBtn(){ const b = $('#dgPause'); if (b) b.innerHTML = `<i class="ic">${ic(DG.live ? 'bolt' : 'refresh')}</i>${DG.live ? 'Pausar' : 'Reanudar'}`; const l = $('#dgLive'); if (l) { l.classList.toggle('off', !DG.live); $('#dgLiveT').textContent = DG.live ? 'En vivo' : 'En pausa'; } }
function diagToggle(){ DG.live = !DG.live; diagPauseBtn(); if (DG.live) diagPoll(true); }
function startDiag(){ if (!$('#dgGrid')._init) { diagInit(); $('#dgGrid')._init = true; } DG.pts = []; diagPoll(true); }
function stopDiag(){ clearTimeout(DG.timer); DG.timer = 0; }

async function diagPoll(full){
  clearTimeout(DG.timer);
  if (S.page !== 'diag') return;
  if (DG.live || full) {
    try {
      const coarse = DG.range > 900;
      const last = DG.pts.length ? DG.pts[DG.pts.length - 1].t : 0;
      const needFull = full || !last || (coarse && Date.now() - DG.lastFull > 10000);
      const s = await caDiag(DG.range, needFull ? 0 : last);
      if (s) {
        if (needFull) { DG.pts = s.points || []; DG.lastFull = Date.now(); } else if (!coarse) DG.pts = DG.pts.concat(s.points || []);
        const from = s.now - DG.range * 1000;
        while (DG.pts.length && DG.pts[0].t < from) DG.pts.shift();
        DG.snap = s; DG.now = s.now;
        diagRender();
      }
    } catch (e) {}
  }
  if (S.page === 'diag') DG.timer = setTimeout(() => diagPoll(false), 1000);
}

function diagRender(){
  const s = DG.snap; if (!s) return;
  const p = DG.pts[DG.pts.length - 1] || {};
  const inf = s.info || {};
  $('#dgHost').textContent = [inf.cpu, inf.memTotal ? fBytes(inf.memTotal) + ' de RAM' : '', 'encendido hace ' + fUptime(s.sys.uptime)].filter(Boolean).join(' · ');
  // ---- estadísticas rápidas (con minigráfica)
  const memPct = s.mem.total ? (s.mem.total - s.mem.avail) / s.mem.total * 100 : 0;
  const spark = (k, max, col) => sparkSVG(DG.pts.slice(-120).map(x => x[k] < 0 ? 0 : x[k]), max, col);
  const st = [
    {t:'Procesador', v:fPct(p.c), c:thrCol(p.c || 0, 60, 85), d: p.f ? fMHz(p.f) : `${s.sys.logical} núcleos lógicos`, sp: spark('c', 100, thrCol(p.c || 0, 60, 85))},
    {t:'Memoria', v:fPct(memPct), c:thrCol(memPct, 80, 90), d:`${fBytes(s.mem.total - s.mem.avail)} de ${fBytes(s.mem.total)}`, sp: spark('m', s.mem.total, thrCol(memPct, 80, 90))},
    {t:'Disco', v:fPct(p.da), c:thrCol(p.da || 0, 70, 90), d:`${fRate((p.dr || 0) + (p.dw || 0))} · ${fMs(p.dl || 0)}`, sp: spark('da', 100, GC.purple)},
    {t:'Red', v:fBits((p.nr || 0) + (p.ns || 0)), c:GC.blue, d:`↓ ${fBits(p.nr)} · ↑ ${fBits(p.ns)}`, sp: spark('nr', 0, GC.green)},
    {t:'Gráfica', v: p.g >= 0 ? fPct(p.g) : '–', c: p.g >= 0 ? thrCol(p.g, 80, 95) : 'var(--text-3)', d: p.gm ? fBytes(p.gm) + ' de vídeo' : (inf.gpus && inf.gpus[0] ? inf.gpus[0].name : 'sin datos'), sp: spark('g', 100, GC.cyan)},
    {t:'Sistema', v: fNum(s.sys.procs), c:'var(--text)', d:`procesos · ${fNum(s.sys.threads)} hilos · ${fNum(s.sys.handles)} identificadores`, sp: ''},
  ];
  if (s.battery) st.push({t:'Batería', v:s.battery.pct + ' %', c:thrCol(100 - s.battery.pct, 70, 90), d: s.battery.ac ? (s.battery.charging ? 'cargando' : 'enchufado') : s.battery.min >= 0 ? `quedan ${fUptime(s.battery.min * 60)}` : 'con batería', sp:''});
  setHTML('#dgStats', st.map(x => `<div class="card dg-stat"><div class="k">${x.t}</div><div class="v" style="color:${x.c}">${x.v}</div><div class="d">${esc(x.d)}</div>${x.sp}</div>`).join(''));
  // ---- diagnóstico automático
  const LV = {bad:['red','alert'], warn:['amber','alert'], info:['blue','info'], ok:['green','check']};
  setHTML('#dgIns', `<div class="dg-insh"><b>Diagnóstico automático</b><span>qué está limitando el rendimiento ahora mismo (último minuto)</span></div>` +
    (s.insights || []).map(x => `<div class="dg-in ${x.level}"><i class="ic" style="color:var(--${LV[x.level][0]})">${ic(LV[x.level][1])}</i><div><b>${esc(x.title)}</b><span>${esc(x.detail)}</span></div></div>`).join(''));
  diagDraw(); diagCores(); diagMem(); diagTables(); diagHw();
}
const setHTML = (sel, h) => { const el = $(sel); if (el && el._h !== h) { el.innerHTML = h; el._h = h; } };

function sparkSVG(vals, max, col){
  if (vals.length < 2) return '';
  const m = max || Math.max(...vals, 1), w = 100, h = 28;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - Math.min(v / m, 1) * (h - 2) - 1).toFixed(1)}`).join(' ');
  return `<svg class="dg-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="0,${h} ${pts} ${w},${h}" fill="${col}" fill-opacity=".14"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.4" vector-effect="non-scaling-stroke"/></svg>`;
}

// ---- gráficas de series temporales (canvas, con cursor compartido entre paneles)
function niceMaxB(v){ const u = [1, 1024, 1048576, 1073741824, 1099511627776]; let i = 0; while (i < u.length - 1 && v >= u[i + 1]) i++; return niceMax(v / u[i]) * u[i]; }
function niceMax(v){ if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function diagDraw(){
  if (S.page !== 'diag' || !DG.snap) return;
  const pts = DG.pts, now = DG.now || Date.now(), from = now - DG.range * 1000;
  const grid = cssv('--line') || '#e5e7eb', txt = cssv('--text-3') || '#888', dark = document.documentElement.classList.contains('tdark');
  document.querySelectorAll('#dgGrid .dg-panel').forEach(el => {
    const P = DPANELS.find(x => x.id === el.dataset.p), cv = el.querySelector('canvas');
    const W = cv.clientWidth, H = cv.clientHeight, dpr = window.devicePixelRatio || 1;
    if (!W || !H) return;
    if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const T = 8, B = 20;
    const val = (x, k) => { const v = x[k]; return v == null || v < 0 ? null : v; };
    let max = P.max || (P.maxF ? P.maxF() : 0);
    if (!P.max) { pts.forEach(x => P.s.forEach(s => { const v = val(x, s.k); if (v != null && v > max) max = v; })); const r = P.ref && P.ref(); if (r && r.v > max) max = r.v; max = (P.bin ? niceMaxB : niceMax)(max * 1.05); }
    let max2 = 0; if (P.s2) { pts.forEach(x => { const v = val(x, P.s2.k); if (v != null && v > max2) max2 = v; }); max2 = (P.s2.bin ? niceMaxB : niceMax)(max2 * 1.05 || 1); }
    // márgenes según lo que ocupan las etiquetas del eje
    g.font = '10.5px Inter, Segoe UI, sans-serif'; g.lineWidth = 1;
    const lw = f => Math.max(...[0, 1, 2, 3, 4].map(i => g.measureText(f(i / 4)).width));
    const L = Math.ceil(lw(i => P.fmt(max * i)) + 12), R = P.s2 ? Math.ceil(lw(i => P.s2.fmt(max2 * i)) + 12) : 10, pw = W - L - R, ph = H - T - B;
    const X = t => L + (t - from) / (now - from) * pw, Y = (v, m) => T + ph - Math.min(v / m, 1) * ph;
    // rejilla y ejes
    for (let i = 0; i <= 4; i++) {
      const y = Math.round(T + ph * i / 4) + .5;
      g.strokeStyle = grid; g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke();
      g.fillStyle = txt; g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillText(P.fmt(max * (4 - i) / 4), L - 6, y);
      if (P.s2) { g.textAlign = 'left'; g.fillText(P.s2.fmt(max2 * (4 - i) / 4), L + pw + 6, y); }
    }
    const span = now - from, stepT = [60e3, 120e3, 300e3, 600e3, 1800e3, 3600e3].find(s => span / s <= 6) || 3600e3;
    g.textAlign = 'center'; g.textBaseline = 'top';
    for (let t = Math.ceil(from / stepT) * stepT; t <= now; t += stepT) {
      const x = Math.round(X(t)) + .5; g.strokeStyle = grid; g.beginPath(); g.moveTo(x, T); g.lineTo(x, T + ph); g.stroke();
      g.fillStyle = txt; g.fillText(new Date(t).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}), x, T + ph + 5);
    }
    // línea de referencia (RAM total, frecuencia nominal)
    const ref = P.ref && P.ref();
    if (ref) { const y = Math.round(Y(ref.v, max)) + .5; g.setLineDash([3, 4]); g.strokeStyle = txt; g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke(); g.setLineDash([]); g.fillStyle = txt; g.textAlign = 'left'; g.textBaseline = 'bottom'; g.fillText(ref.n, L + 4, y - 2); }
    // series (con relleno degradado) — se corta la línea donde faltan datos
    const gapMs = (DG.range > 900 ? 10 : 1) * 3500;
    const drawSeries = (k, col, m, fill, dash) => {
      const segs = []; let cur = [];
      pts.forEach((x, i) => { const v = val(x, k); if (v == null || (i && x.t - pts[i - 1].t > gapMs)) { if (cur.length) segs.push(cur); cur = []; } if (v != null) cur.push([X(x.t), Y(v, m)]); });
      if (cur.length) segs.push(cur);
      segs.forEach(sg => {
        if (fill && sg.length > 1) {
          const gr = g.createLinearGradient(0, T, 0, T + ph); gr.addColorStop(0, col + Math.round(fill * 255 * (dark ? 1.3 : 1)).toString(16).padStart(2, '0')); gr.addColorStop(1, col + '00');
          g.fillStyle = gr; g.beginPath(); g.moveTo(sg[0][0], T + ph); sg.forEach(p => g.lineTo(p[0], p[1])); g.lineTo(sg[sg.length - 1][0], T + ph); g.closePath(); g.fill();
        }
        g.strokeStyle = col; g.lineWidth = 1.6; g.setLineDash(dash || []); g.beginPath(); sg.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); g.setLineDash([]);
      });
    };
    P.s.forEach(s => drawSeries(s.k, s.c, max, s.fill, s.dash));
    if (P.s2) drawSeries(P.s2.k, P.s2.c, max2, 0, [2, 3]);
    // cursor compartido
    const tip = el.querySelector('.dg-tip');
    if (DG.hover && pts.length) {
      const t = from + (DG.hover.x * W - L) / pw * (now - from);
      let best = null, bd = Infinity; pts.forEach(x => { const d = Math.abs(x.t - t); if (d < bd) { bd = d; best = x; } });
      if (best && t >= from - 5000 && t <= now + 5000) {
        const x = Math.round(X(best.t)) + .5;
        g.strokeStyle = txt; g.setLineDash([2, 3]); g.beginPath(); g.moveTo(x, T); g.lineTo(x, T + ph); g.stroke(); g.setLineDash([]);
        P.s.forEach(s => { const v = val(best, s.k); if (v != null) { g.fillStyle = s.c; g.beginPath(); g.arc(x, Y(v, max), 3, 0, 7); g.fill(); } });
        if (DG.hover.id === P.id) {
          tip.innerHTML = `<b>${new Date(best.t).toLocaleTimeString('es-ES')}</b>` + P.s.map(s => `<div><i style="background:${s.c}"></i>${s.n}<em>${val(best, s.k) == null ? '–' : P.fmt(best[s.k])}</em></div>`).join('') +
            (P.s2 ? `<div><i style="background:${P.s2.c}"></i>${P.s2.n}<em>${val(best, P.s2.k) == null ? '–' : P.s2.fmt(best[P.s2.k])}</em></div>` : '');
          tip.style.display = 'block'; const left = x + 12 + 180 > W ? x - 192 : x + 12; tip.style.left = left + 'px'; tip.style.top = '10px';
        } else tip.style.display = 'none';
      } else tip.style.display = 'none';
    } else tip.style.display = 'none';
    // leyenda con actual / mín / máx / media
    const rows = P.s.map(s => [s, P.fmt]).concat(P.s2 ? [[P.s2, P.s2.fmt]] : []).map(([s, f]) => {
      const v = pts.map(x => val(x, s.k)).filter(x => x != null);
      if (!v.length) return `<tr><td><i style="background:${s.c}"></i>${s.n}</td><td colspan="4" class="mu">sin datos</td></tr>`;
      const avg = v.reduce((a, b) => a + b, 0) / v.length;
      return `<tr><td><i style="background:${s.c}"></i>${s.n}</td><td>${f(v[v.length - 1])}</td><td>${f(Math.min(...v))}</td><td>${f(Math.max(...v))}</td><td>${f(avg)}</td></tr>`;
    }).join('');
    setHTMLel(el.querySelector('.dg-leg'), `<table><thead><tr><th></th><th>Actual</th><th>Mín</th><th>Máx</th><th>Media</th></tr></thead><tbody>${rows}</tbody></table>`);
  });
}
const setHTMLel = (el, h) => { if (el && el._h !== h) { el.innerHTML = h; el._h = h; } };

// ---- núcleos: mosaico con el uso actual y su minigráfica del último minuto
function diagCores(){
  const s = DG.snap, n = (s.cores || []).length;
  if (!n) { setHTML('#dgCores', '<div class="dg-empty">Sin datos de los núcleos.</div>'); return; }
  const hist = DG.pts.slice(-60);

  setHTML('#dgNics', (s.nics || []).length ? `<table class="dg-tbl"><thead><tr><th>Conexión</th><th class="r">Recibido</th><th class="r">Enviado</th><th class="r">Enlace</th><th class="r">Uso</th></tr></thead><tbody>` +

  const id = LIST_PAGES.includes(p) ? 'p-list' : 'p-' + p;
  $('#' + id).classList.add('on');

    $('#lTitle').textContent = TITLES[p]; $('#lSub').textContent = SUBS[p] || '';

    $('#lBtns').innerHTML = p === 'updates' ? updBtns() : p === 'protect' ? protBtns() : p === 'net' ? netBtns() : headBtns();

    if (!keepChip) S.q = '';
    buildChips();
    const lq = $('#lq');
    if (lq) {
      lq.value = S.q;
      lq.parentElement.classList.toggle('has', !!S.q);
      lq.placeholder = p === 'apps' ? 'Buscar aplicación…' : p === 'pentest' ? 'Buscar hallazgo…' : 'Buscar…';

  }
  if (p === 'history') { $('#histSubtabs').innerHTML = subtabsHTML(p); loadHistory(); }
  if (p === 'log') $('#logSubtabs').innerHTML = subtabsHTML(p);
  if (p === 'tools') renderTools();
  if (p === 'traffic') startTraffic(); else stopTraffic();
  if (p === 'diag') startDiag(); else stopDiag();

  if (p === 'scanfile') faInit();

}

function setupPalette(){

  q.onfocus = () => { PALS.sel = 0; renderPalette(); $('#pal').classList.add('on'); };
  q.oninput = () => { PALS.sel = 0; S.q = ''; renderPalette(); $('#pal').classList.add('on'); };
  q.onkeydown = e => {
    if (e.key === 'ArrowDown') { PALS.sel = Math.min(PALS.sel + 1, PALS.opts.length - 1); renderPalette(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { PALS.sel = Math.max(PALS.sel - 1, 0); renderPalette(); e.preventDefault(); }
    else if (e.key === 'Enter') { runPalette(PALS.sel); e.preventDefault(); }

/* --- recomendaciones: agrupa lo pendiente por la acción que lo resuelve --- */
function recommendations(){
  const g = {};
  const add = (key, title, page, chip, it, pts, extra) => {
    const r = g[key] || (g[key] = {title, page, chip, pts:0, names:[], n:0, extra});
    r.pts += pts; r.n++; if (r.names.length < 3) r.names.push(it.name.replace(/\s*\(.*$/, ''));
  };
  S.items.forEach(it => {
    if (it.category === 'Aplicaciones' && it.tag === 'Prescindible' && it.action === 'uninstall' && !['Desinstalada','Oculto'].includes(it.status)) { add('apps', '', 'apps', 't:Prescindible', it, 0, 'apps'); return; }
    if (!['Vulnerable','Actualizar','Revisar','Falló'].includes(it.status)) return;
    const pts = (it.status === 'Vulnerable' ? 12 : 3) + (it.exploited ? 10 : 0);
    const c = it.category;
    if (it.action === 'winupdate' || c === 'Windows') add('win', 'Instalar parches de Windows', 'updates', 'pending', it, pts);
    else if (c === 'Seguridad') add('secw', 'Corregir ajustes de seguridad de Windows', 'protect', 'pending', it, pts);
    else if (c === 'Programas') add('prog', 'Actualizar programas', 'updates', 'pending', it, pts);
    else if (c === 'Navegadores') add('ext', 'Revisar extensiones del navegador', 'protect', 'pending', it, pts);
    else if (c === 'Secretos') add('sec', 'Proteger archivos con contraseñas', 'protect', 'pending', it, pts);
    else if (c === 'Copias') add('copy', 'Reforzar la protección contra ransomware', 'protect', 'pending', it, pts);
    else if (c === 'Hardware') add('hw', 'Revisar el hardware', 'hw', 'pending', it, pts);
    else if (c === 'Red' || c === 'Intrusiones') add('net', 'Corregir la configuración de red', 'net', 'pending', it, pts);
    else if (c === 'Web' || c === 'Servidores') add('srv', 'Revisar tus webs y servidores', 'net', 'pending', it, pts);
    else if (c === 'Cambios') add('chg', 'Revisar cambios en el equipo', 'changes', 'pending', it, pts);
    else if (['Node.js','npm global','Python','Proyecto','Docker'].includes(c)) add('dev', 'Actualizar herramientas de desarrollo', 'updates', 'pending', it, pts);
    else if (c === 'Eventos') add('ev', 'Revisar avisos del Visor de eventos', 'events', 'pending', it, pts);
    else if (c === 'Endurecimiento' || c === 'Pentest') add('hard', 'Corregir ajustes que usaría un atacante', 'protect', 'pending', it, pts);
    else if (c === 'Vulnerabilidades') add('vul', 'Actualizar programas con fallos conocidos', 'updates', 'pending', it, pts);
    else if (c === 'Red local') add('lan', 'Revisar dispositivos de tu red', 'net', 'pending', it, pts);
  });
  const list = Object.values(g).sort((a, b) => b.pts - a.pts);
  list.forEach(r => { if (r.extra === 'apps') r.title = `Quitar ${r.n} aplicaciones prescindibles`; else if (r.n > 1 && !/^Instalar|^Revisar cambios/.test(r.title)) r.title += ` (${r.n})`; });
  return list.slice(0, 5);
}

function appendLogs(lines){
  if (!lines || !lines.length) return;
  const box = $('#log'); const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  const frag = document.createDocumentFragment();
  lines.forEach(l => { const d = document.createElement('div'); d.className = 'l-' + l.l; d.textContent = `[${l.t}] ${l.m}`; frag.appendChild(d);
    if ((l.l === 'ok' && /^(✔|Liberad|Extensión|.*desinstalad)/.test(l.m)) || l.l === 'err') { LIVE.push({t: String(l.t).slice(0,5), m: l.m.replace(/^[✔✖]\s*/, ''), k: l.l === 'err' ? 'err' : 'ok'}); if (LIVE.length > 20) LIVE.shift(); } });
  box.appendChild(frag);
  while (box.childNodes.length > 4000) box.removeChild(box.firstChild);
  if (atEnd) box.scrollTop = box.scrollHeight;
  if (SC.on) scLog(lines);
}

/* ====================== ventana de progreso cíber ====================== */
const SC = {on:false, raf:0, drops:[], w:0, h:0, started:false};
const SC_TITLE = {update:'Aplicando cambios', pentest:'Revisión de seguridad', 'pentest-lan':'Analizando la red local', clean:'Liberando espacio', '':'Analizando el equipo'};
function scanner(show){
  const el = $('#scanner');
  SC.on = show;
  el.classList.toggle('on', show);
  if (show) { $('#scHost').textContent = (S.init && S.init.computer || '') ; scStart(); } else scStop();
}
function scStart(){
  if (SC.raf) return;
  const c = $('#scCanvas'), x = c.getContext('2d');
  const resize = () => { SC.w = c.width = c.offsetWidth; SC.h = c.height = c.offsetHeight; const cols = Math.ceil(SC.w/16); SC.drops = Array.from({length:cols}, () => Math.random()*SC.h); };
  resize(); SC._resize = resize; window.addEventListener('resize', resize);
  const glyphs = '01<>/\[]{}#$%&ｦｱｳｴｵｶｷｸﾊﾋﾎﾏﾐABCDEF'.split('');
  const draw = () => {
    x.fillStyle = 'rgba(31,41,69,.16)'; x.fillRect(0,0,SC.w,SC.h);
    x.font = '14px "Cascadia Mono",monospace';
    for (let i=0;i<SC.drops.length;i++){
      const ch = glyphs[(Math.random()*glyphs.length)|0];
      const px = i*16, py = SC.drops[i];
      x.fillStyle = Math.random()<.04 ? 'rgba(167,139,250,.9)' : 'rgba(45,212,238,'+(0.25+Math.random()*0.5)+')';
      x.fillText(ch, px, py);
      SC.drops[i] = py > SC.h + Math.random()*260 ? 0 : py + (8+Math.random()*8);
    }
    SC.raf = requestAnimationFrame(draw);
  };
  SC.raf = requestAnimationFrame(draw);
}
function scStop(){ if (SC.raf) cancelAnimationFrame(SC.raf); SC.raf = 0; if (SC._resize) window.removeEventListener('resize', SC._resize); }
function scLog(lines){
  const box = $('#scLog'); if (!box) return;
  const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  lines.forEach(l => { const d = document.createElement('div'); d.className = 'l-'+l.l; d.textContent = `${l.t}  ${l.m}`; box.appendChild(d); });
  while (box.childNodes.length > 400) box.removeChild(box.firstChild);
  if (atEnd) box.scrollTop = box.scrollHeight;
}
let scDone = 0;
function updateScanner(st, wasBusy){
  if (st.phase === 'refresh') return; // refresco ligero en segundo plano: sin ventana
  if (st.busy && !wasBusy && !SC.userClosed) scanner(true);
  if (!st.busy) { SC.userClosed = false; if (SC.on) { scFinish(st); } return; }
  if (!SC.on) return;
  const phase = st.phase || '';
  $('#scTag').textContent = SC_TITLE[phase] || 'Procesando';
  $('#scTermHd').textContent = 'Registro en vivo · ' + (SC_TITLE[phase]||'').toLowerCase();
  const [v, m] = st.prog || [0,0];
  const pct = m ? Math.round(100*v/m) : null;
  const ring = $('#scRing'), C = 2*Math.PI*128;
  if (pct === null) { $('#scPct').textContent = '•••'; $('#scPct').style.fontSize='38px'; $('#scPctL').textContent=''; ring.setAttribute('stroke-dasharray', `${C*0.25} ${C}`); ring.style.animation='sweep 1.4s linear infinite'; }
  else { $('#scPct').textContent = pct; $('#scPct').style.fontSize=''; $('#scPctL').textContent='%'; ring.style.animation=''; ring.setAttribute('stroke-dasharray', `${Math.max(1,C*pct/100)} ${C}`); }
  // tarea actual + "blips" de lo que se está analizando
  const status = st.status || '';
  let task = status, blips = [];
  const mm = status.match(/^Analizando (.+?)\.\.\.$/);
  if (mm) { blips = mm[1].split(/,\s*/); task = 'Analizando el equipo'; }
  $('#scTask').textContent = task;
  $('#scCount').textContent = m ? `${v} de ${m} comprobaciones` : 'Trabajo en segundo plano…';
  if (blips.length) $('#scBlips').innerHTML = blips.slice(0,8).map(b => `<span class="blip">${esc(b)}</span>`).join('');
  else if (phase !== '') $('#scBlips').innerHTML = '';
}
function scFinish(st){
  const [v,m] = st.prog || [1,1];
  $('#scRing').setAttribute('stroke-dasharray', `${2*Math.PI*128} ${2*Math.PI*128}`); $('#scRing').style.stroke = '#34d399'; $('#scRing').style.filter='drop-shadow(0 0 8px #34d399)';
  $('#scPct').textContent = '100'; $('#scPct').style.fontSize=''; $('#scPctL').textContent='%';
  $('#scTag').textContent = 'Completado'; $('#scTask').textContent = st.result || 'Proceso terminado.';
  $('#scCount').textContent = ''; $('#scBlips').innerHTML = `<span class="blip" style="color:#6ee7b7;border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)">✓ Terminado</span>`;
  setTimeout(() => { scanner(false); $('#scRing').style.stroke=''; $('#scRing').style.filter='drop-shadow(0 0 6px #22d3ee)'; $('#scLog').innerHTML=''; }, 2200);
}
function closeScanner(){ SC.userClosed = true; scanner(false); }

let pollT;
async function poll(force){
  clearTimeout(pollT);
  try {
    const st = await caState(force ? -1 : S.ver, S.logNext);
    S.logNext = st.logNext; appendLogs(st.logs);
    const changed = st.items !== undefined && st.items !== null;
    if (changed) { S.items = st.items || []; S.ver = st.ver; }
    S.lastScan = st.lastScan || null;
    const wasBusy = S.busy; S.busy = st.busy; if (S.bgUpd !== !!st.bgUpd) { S.bgUpd = !!st.bgUpd; if (typeof renderUbar === 'function') renderUbar(); }
    $('#status').textContent = st.status || 'Listo.';
    updateScanner(st, wasBusy);
    const bar = $('#bar'); const [v, m] = st.prog || [0,0];
    bar.classList.toggle('ind', S.busy && !m);
    bar.firstElementChild.style.width = S.busy && m ? (Math.max(4, 100*v/m)) + '%' : (S.busy ? '' : '0');
    if (changed || wasBusy !== S.busy) render();
    if (wasBusy && !S.busy && st.result && st.result !== S.result) { S.result = st.result; toast(esc(st.result)); }
    if (wasBusy && !S.busy) { loadActivity(); loadScoreTrend(); caDisk().then(d => { DISK = d; render(); }); if (S.page === 'history') loadHistory(); }
  } catch (e) {}
  pollT = setTimeout(poll, S.busy ? 500 : document.hidden ? 4000 : 1500);
}

const OS_COL = ['#2f7de1','#1fb384','#6a4fd8','#e873a5','#0a8a0a','#8a93b2'];
const osFamily = s => { s = String(s || '').trim(); const m = s.match(/^(Windows Server \d{4}|Windows \d+|Ubuntu [\d.]+|Debian \d+|macOS|Linux)/i); return m ? m[1] : (s.split(/\s+/).slice(0, 2).join(' ') || 'Desconocido'); };
function panelGo(k){ panelShow('pcs'); P.sel = k; renderFleet(); }
function renderFleetDash(){
  const f = P.fleet;
  const old = f.filter(p => p.state === 'Sin informar').length, iso = f.filter(p => p.isolated).length;
  const vul = f.filter(p => p.vuln).length, exp = f.filter(p => p.exploited).length;
  const sc = f.filter(p => p.score >= 0), avg = sc.length ? Math.round(sc.reduce((a, p) => a + p.score, 0) / sc.length) : null;
  const kt = (label, big, d, cls, go) => `<div class="card kt ${cls || ''}" onclick="${go}"><div class="k">${label}</div><div class="big">${big}</div><div class="d">${d}</div></div>`;
  $('#pdKpis').innerHTML =
    kt('Equipos activos', f.length - old, `de ${f.length} gestionados`, '', "panelShow('pcs')") +
    kt('Puntuación media', avg === null ? '–' : `${avg}<small>/ 100</small>`, `${sc.length} equipo${sc.length === 1 ? '' : 's'} con informe`, avg !== null && avg < 60 ? 'bad' : avg !== null && avg < 85 ? 'warn' : '', "panelShow('pcs')") +
    kt('Con vulnerabilidades', vul, exp ? `${exp} con fallos explotados` : 'ninguno con fallos explotados', exp ? 'bad' : vul ? 'warn' : '', "panelShow('pcs')") +
    kt('Sin informar', old, iso ? `más de 3 días · ${iso} aislado${iso > 1 ? 's' : ''}` : 'más de 3 días', old ? 'warn' : '', "panelShow('pcs')");
  // distribución de equipos por puntuación
  const B = [['< 40', 0, 39], ['40–59', 40, 59], ['60–74', 60, 74], ['75–84', 75, 84], ['85–94', 85, 94], ['95+', 95, 100]];
  const bp = B.map(b => ({l: b[0], v: sc.filter(p => p.score >= b[1] && p.score <= b[2]).length}));
  $('#pdChart').innerHTML = sc.length ? barChart(bp, Math.max(1, ...bp.map(b => b.v)), 236) : '<div class="empty-c">Todavía no ha llegado ningún informe.</div>';
  // sistemas operativos
  const g = {}; f.forEach(p => { const k = osFamily(p.os); g[k] = (g[k] || 0) + 1; });
  const rows = Object.entries(g).sort((a, b) => b[1] - a[1]), rest = rows.slice(5);
  const segs = rows.slice(0, 5).map((r, i) => ({n: r[0], v: r[1], c: OS_COL[i]}));
  if (rest.length) segs.push({n: `Otros (${rest.length} ${rest.length === 1 ? 'versión' : 'versiones'})`, v: rest.reduce((a, r) => a + r[1], 0), c: OS_COL[5]});
  $('#pdRing').innerHTML = donutSVG(segs) + `<div class="c"><b>${f.length}</b><span>equipos</span></div>`;
  $('#pdLeg').innerHTML = f.length ? legendHTML(segs, f.length) : '<div style="grid-template-columns:1fr;color:var(--text-3)"><span>Sin equipos todavía</span></div>';
  // listas
  const row = (p, val, bar, col) => ({i: 'pc', n: p.computer, d: p.user || '', p: bar, t: String(val), c: col, go: `panelGo('${esc(p.computer)}')`});
  $('#pdLow').innerHTML = usageList(sc.slice().sort((a, b) => a.score - b.score).slice(0, 5).map(p => row(p, p.score, p.score, ACOL(p.score))), 'Todavía no ha llegado ningún informe.');
  const mv = Math.max(1, ...f.map(p => p.vuln || 0)), mu = Math.max(1, ...f.map(p => p.upd || 0));
  $('#pdVuln').innerHTML = usageList(f.filter(p => p.vuln).sort((a, b) => b.vuln - a.vuln).slice(0, 5).map(p => row(p, p.vuln, 100 * p.vuln / mv, '#d92d20')), 'Ningún equipo con vulnerabilidades.');
  $('#pdUpd').innerHTML = usageList(f.filter(p => p.upd).sort((a, b) => b.upd - a.upd).slice(0, 5).map(p => row(p, p.upd, 100 * p.upd / mu, '#d99a1b')), 'Ningún equipo con actualizaciones pendientes.');
}

function aggregate(){
  const agg = {};
  P.fleet.forEach(pc => (pc.items||[]).forEach(it => {
    if (!['Vulnerable','Actualizar','Revisar','Falló'].includes(it.Status)) return;
    const k = it.Key || it.Name;
    const a = agg[k] || (agg[k] = {name:it.Name, category:it.Category, vuln:0, upd:0, versions:new Set(), latest:'', pcs:[], detail:it.Detail});
    if (it.Status === 'Vulnerable') a.vuln++; else a.upd++;
    a.versions.add(it.Current); if (it.Available && it.Available !== '-') a.latest = it.Available; a.pcs.push(pc.computer);
  }));
  return Object.values(agg).sort((x, y) => y.vuln - x.vuln || y.pcs.length - x.pcs.length || x.name.localeCompare(y.name));
}

const CMDL = {pentest:'Auditar y corregir', scan:'Escanear ahora', update:'Actualizar ahora', reboot:'Reiniciar esta noche', isolate:'Aislar de la red', unisolate:'Reconectar a la red', clean:'Limpiar archivos basura'};
function compareVersions(a, b){ const x = String(a||'0').split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i]||0) !== (y[i]||0)) return (x[i]||0) < (y[i]||0) ? -1 : 1; } return 0; }
function cmdBtn(pc, action, text){ return `<button class="btn sm ${action==='isolate'?'danger':''}" onclick="sendCmd('${esc(pc.computer)}','${action}')">${text}</button>`; }
function sendCmd(pc, action){
  const warn = {isolate:'<p>El equipo se quedará <b>sin Internet ni red local</b> (salvo OneDrive y BlueShieldAA) hasta que envíes "Reconectar a la red".</p>',
    reboot:'<p>El equipo se reiniciará hoy a las 22:00 (el usuario verá un aviso para guardar su trabajo).</p>',
    update:'<p>Se aplicarán las actualizaciones que permite la política, aunque el usuario esté ocupado.</p>',
    pentest:'<p>El equipo se auditará como lo haría un atacante, corregirá automáticamente lo que es seguro corregir y dejará su informe en la carpeta de empresa (botón «Ver informe de seguridad»).</p>'}[action] || '';
  modal(CMDL[action] + ' · ' + pc, warn + '<p style="color:var(--text-3)">La orden va firmada con la clave de este panel. El equipo la recoge en menos de 10 minutos si está encendido y con OneDrive sincronizado; caduca en 24 horas.</p>',
    [{t:'Cancelar'}, {t:'Enviar orden', c:'pri', f: async () => { const m = await pnCommand(pc, action); toast(m ? 'No se pudo enviar: ' + esc(m) : 'Orden enviada.'); loadFleet(); }}]);
}
function renderBatchBar(){
  const bar = $('#pbatch'); if (!bar) return;
  const names = new Set(P.fleet.map(p => p.computer));
  [...P.selected].forEach(c => { if (!names.has(c)) P.selected.delete(c); });
  const n = P.selected.size;
  if (P.page !== 'pcs' || n === 0) { bar.classList.remove('on'); bar.innerHTML = ''; return; }
  const b = (action, text, cls) => `<button class="btn sm ${cls||''}" onclick="sendCmdBatch('${action}')">${text}</button>`;
  bar.innerHTML = `<b>${n} equipo(s) seleccionado(s)</b><div class="sp"></div>` +
    b('scan','Escanear') + b('update','Actualizar') + b('clean','Limpiar') + b('pentest','Auditar') + b('reboot','Reiniciar') + b('isolate','Aislar','danger') +
    `<button class="btn sm" onclick="clearSel()">Quitar selección</button>`;
  bar.classList.add('on');
}
function toggleSel(pc){ if (P.selected.has(pc)) P.selected.delete(pc); else P.selected.add(pc); renderFleet(); }
function toggleAllSel(){
  const rows = P.fleet.filter(pc => !P.q || (pc.computer + ' ' + (pc.user||'')).toLowerCase().includes(P.q));
  const all = rows.length > 0 && rows.every(pc => P.selected.has(pc.computer));
  rows.forEach(pc => { if (all) P.selected.delete(pc.computer); else P.selected.add(pc.computer); });
  renderFleet();
}
function clearSel(){ P.selected.clear(); renderFleet(); }
function sendCmdBatch(action){
  const pcs = [...P.selected];
  if (!pcs.length) return;
  const warn = {isolate:'<p>Los equipos se quedarán <b>sin Internet ni red local</b> (salvo OneDrive y BlueShieldAA) hasta que envíes «Reconectar a la red» a cada uno.</p>',
    reboot:'<p>Los equipos se reiniciarán hoy a las 22:00 (cada usuario verá un aviso para guardar su trabajo).</p>',
    update:'<p>Se aplicarán las actualizaciones que permita la política, aunque el usuario esté ocupado.</p>',
    pentest:'<p>Cada equipo se auditará como un atacante, corregirá lo seguro y dejará su informe en la carpeta de empresa.</p>'}[action] || '';
  modal(`${CMDL[action]} · ${pcs.length} equipo(s)`, warn + `<p style="color:var(--text-3)">La orden va firmada con la clave de este panel. Cada equipo la recoge en su próxima sincronización (unos minutos) si está encendido; caduca en 24 h.</p><p style="font-size:12px;color:var(--text-4)">${pcs.slice(0,12).map(esc).join(', ')}${pcs.length>12?' …':''}</p>`,
    [{t:'Cancelar'}, {t:`Enviar a ${pcs.length} equipo(s)`, c: action==='isolate'?'danger':'pri', f: async () => { const m = await pnCommandBatch(pcs, action); toast(esc(m||'Órdenes enviadas.')); P.selected.clear(); loadFleet(); }}]);
}
async function testHook(){ const m = await pnTestWebhook($('#phook').value.trim()); toast(m ? 'No se pudo enviar: ' + esc(m) : 'Mensaje de prueba enviado. Comprueba el canal.'); }

async function startPanel(){
  const init = await caInit();
  buildTabs(PANEL_TABS, panelShow); panelPages();
  document.body.classList.add('pnl');
  $('#bell').style.display = 'none'; $('#hFix').style.display = 'none';
  $('#hScan').title = 'Recargar los informes'; $('#hScan').onclick = () => loadFleet();
  $('#tbTitle').textContent = 'BlueShieldAA — Panel de empresa';
  { const nm = init.computer || 'Administrador'; $('#meName').textContent = nm; $('#meAv').textContent = nm.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '–'; $('#meRole').textContent = 'Administrador de la empresa'; }
  $('#meChip').title = 'Administrador de la empresa · versión ' + init.version + (init.keyFP ? ' · clave ' + init.keyFP : '');
  applyTheme(init.theme || 'light');
  P.shared = init.sharedPath || '';
  await loadFleet();
  setInterval(() => { if (P.page !== 'policy') loadFleet(); }, 300000);
}

(MODE === 'panel' ? startPanel : startApp)();
</script>
</body>
