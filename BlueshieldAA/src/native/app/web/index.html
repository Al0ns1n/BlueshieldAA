:root{
  --bg:#f1f3f8;--card:#fff;--stroke:#e2e6ef;--stroke-2:#cdd5e4;--hover:#f5f7fb;
  --text:#1c2640;--text-2:#44506c;--text-3:#6a7590;--text-4:#9aa3b8;
  --navy:#2e3a59;--navy-2:#27324d;
  --accent:#2f7de1;--accent-bg:#e8f1fd;--accent-ink:#1b5fbd;--cyan:var(--accent);
  --bar:#46618f;
  --red:#d92d20;--red-bg:#fdeceb;--red-ink:#b42318;
  --amber:#b7791f;--amber-bg:#fdf3dc;--amber-ink:#8a5a0a;
  --green:#12a06b;--green-bg:#e3f6ee;--green-ink:#0b7a52;
  --blue-bg:#e8f1fd;--blue-ink:#1b5fbd;
  --vio:#6a4fd8;--vio-bg:#eeeafc;--vio-ink:#4f37b8;
  --grey-bg:#eceff5;--grey-ink:#4a5572;
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,monospace;--display:"Space Grotesk",Inter,"Segoe UI",sans-serif;
  --field:#fff;--soft:#eef1f7;--soft-2:#f6f8fc;--head:#f8f9fc;--line:#edf0f6;--btn-hover:#f3f5fa;--warm:#fffaf0;--tick-b:#b3bdd2;--banner-b:#c6dbf7;--scroll:#c4ccdc;--titlebar:#fff;--icon:#3b4666;--shadow:rgba(30,45,90,.12);--group:#fbfcfe;--strong:#2b3658;--sel:#eaf1fc;--track:#e6eaf2;
  --muted:var(--text-3);--dim:var(--text-4);--ok:var(--green);--warn:var(--amber);--bad:var(--red);--sky:var(--accent)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--text);font:13px/1.45 Inter,"Segoe UI",system-ui,sans-serif;overflow:clip;user-select:none;-webkit-font-smoothing:antialiased}
body{background:var(--bg)}
button{font:inherit;color:inherit}
.ic{display:inline-flex;font-style:normal;line-height:1}.ic svg{width:1em;height:1em}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background-color:#aab4c9}::-webkit-scrollbar-track{background:transparent}
.disp{font-family:Inter,sans-serif}

/* ---------- ventana: barra de título + carcasa ---------- */
.app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.titlebar{height:32px;flex:none;display:flex;align-items:center;background:var(--titlebar);color:var(--text);font-size:12px;padding-left:12px;gap:9px}
.titlebar .ti{font-size:15px;color:var(--strong)}
.titlebar .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption{display:flex;height:100%;flex:none}
.caption button{all:unset;width:46px;height:100%;display:grid;place-items:center;cursor:default;color:var(--text)}
.caption button:hover{background:var(--btn-hover)}
.caption button.cl:hover{background:#e81123;color:#fff}
.caption svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.1}
.caption .rs{display:none}body.max .caption .rs{display:block}body.max .caption .mx{display:none}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:254px minmax(0,1fr)}

/* ---------- barra lateral ---------- */
.side{background:var(--navy);display:flex;flex-direction:column;min-height:0;color:#cdd5e6}
.brand{display:flex;align-items:center;gap:12px;padding:20px 22px 16px;font:700 21px/1 Inter,sans-serif;color:#fff;letter-spacing:-.3px;flex:none}
.brand img{width:34px;height:34px;object-fit:contain}
.tabs{flex:1;min-height:0;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:3px}
.tabs::-webkit-scrollbar-thumb{background-color:rgba(255,255,255,.14)}
.tab{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;gap:14px;min-height:40px;padding:0 14px;border-radius:8px;color:#cdd5e6;cursor:pointer;font-size:14.5px;font-weight:500;transition:background .12s,color .12s;flex:none}
.tab>.ic:first-child{font-size:19px;flex:none;color:#b3bed7}
.tab .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab:hover{background:rgba(255,255,255,.06);color:#fff}
.tab.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.tab.on>.ic:first-child,.tab:hover>.ic:first-child{color:#fff}
.tab.on::before{content:"";position:absolute;left:-2px;top:8px;bottom:8px;width:3px;border-radius:2px;background:#d63a43}
.tab .chev{font-size:15px;opacity:.65;transition:transform .15s}
.tab.open .chev{transform:rotate(180deg)}
.tab.grp.has-on{color:#fff}.tab.grp.has-on>.ic:first-child{color:#fff}
.tabsub{display:none;flex-direction:column;gap:2px;margin:1px 0 5px}
.tabsub.open{display:flex}
.subtab{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;gap:8px;min-height:34px;padding:0 14px 0 47px;border-radius:8px;color:#a9b5d0;cursor:pointer;font-size:13.5px;font-weight:500;flex:none}
.subtab:hover{background:rgba(255,255,255,.05);color:#fff}
.subtab.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.subtab.on::before{content:"";position:absolute;left:-2px;top:7px;bottom:7px;width:3px;border-radius:2px;background:#d63a43}
.nb{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#d92d20;color:#fff;font:700 11px/20px Inter,sans-serif;text-align:center;white-space:nowrap;flex:none}
.nb.v{background:#7a5af8}
.me{display:flex;align-items:center;gap:11px;margin:6px 16px 0;padding:14px 4px 14px 6px;border-top:1px solid rgba(255,255,255,.09);flex:none;cursor:pointer}
.me .av2{width:36px;height:36px;border-radius:50%;background:#46659a;color:#fff;font:700 13px Inter,sans-serif;display:grid;place-items:center;flex:none}
.me .who{min-width:0;flex:1}
.me .who b{display:block;color:#fff;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who small{display:block;color:#8e9ab6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{all:unset;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:#aeb9d1;cursor:pointer;font-size:19px;flex:none}
.rb:hover,.rb.on{background:rgba(255,255,255,.1);color:#fff}

/* ---------- cabecera ---------- */
.main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;height:64px;flex:none;padding:0 24px 0 28px;background:var(--field);border-bottom:1px solid var(--stroke)}
.top .ttl{min-width:0;flex:1}
.top h1{margin:0;font:700 19px/1.2 Inter,sans-serif;letter-spacing:-.2px;white-space:nowrap}
.top .s{color:var(--text-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.av-btn{width:36px;height:36px;border-radius:9px;background:var(--field);border:1px solid var(--stroke);display:grid;place-items:center;color:var(--icon);cursor:pointer;position:relative;font-size:18px;flex:none;transition:background .12s,border-color .12s}
.av-btn:hover{background:var(--btn-hover);border-color:var(--stroke-2)}
.av-btn:disabled{opacity:.45;pointer-events:none}
.av-btn .d{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#d92d20;border:2px solid var(--field);display:none;box-sizing:content-box;margin:-2px}
.cmd{position:relative;display:flex;align-items:center;gap:9px;width:36px;height:36px;border-radius:9px;background:var(--field);border:1px solid var(--stroke);padding:0 9px;color:var(--icon);cursor:pointer;flex:none;transition:width .18s ease,border-color .15s,box-shadow .15s}
.cmd .ic{font-size:17px;flex:none}
.cmd input{all:unset;flex:1;min-width:0;opacity:0;color:var(--text);font-size:13px}
.cmd input::placeholder{color:var(--text-4)}
.cmd kbd{display:none;font:600 11px Inter;border:1px solid var(--stroke-2);border-radius:5px;padding:1px 6px;color:var(--text-3);background:var(--soft-2)}
.cmd:focus-within,.pnl .cmd{width:330px;cursor:text}
.cmd:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,125,225,.14)}
.cmd:focus-within input,.pnl .cmd input{opacity:1}
.cmd:focus-within kbd{display:inline-block}
.pal{position:absolute;right:-1px;top:44px;width:400px;background:var(--field);border:1px solid var(--stroke);border-radius:12px;padding:6px;display:none;z-index:40;box-shadow:0 18px 50px -12px rgba(25,40,80,.28);max-height:420px;overflow:auto;cursor:default}
.pal.on{display:block}
.pal .g{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-4);padding:8px 10px 4px}
.pal .o{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text);cursor:pointer}
.pal .o .ic{font-size:15px;color:var(--text-3)}
.pal .o small{margin-left:auto;color:var(--text-4);font-size:11.5px}
.pal .o.on{background:var(--accent-bg)}.pal .o.on .ic{color:var(--accent)}
.rz{position:fixed;z-index:30}
.rz.t{top:0;left:8px;right:8px;height:4px;cursor:ns-resize}.rz.b{bottom:0;left:8px;right:8px;height:5px;cursor:ns-resize}
.rz.l{left:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}.rz.r{right:0;top:8px;bottom:8px;width:5px;cursor:ew-resize}
.rz.tl{top:0;left:0;width:9px;height:9px;cursor:nwse-resize}.rz.br{bottom:0;right:0;width:9px;height:9px;cursor:nwse-resize}
.rz.tr{top:0;right:0;width:9px;height:9px;cursor:nesw-resize}.rz.bl{bottom:0;left:0;width:9px;height:9px;cursor:nesw-resize}
body.max .rz{display:none}

/* ---------- páginas ---------- */
.pages{flex:1;min-height:0;position:relative}
.page{position:absolute;inset:0;display:none;overflow:auto;padding:24px 28px 18px}
.page.on{display:block;animation:fade .2s ease}
.page.fill{flex-direction:column;overflow:hidden}.page.fill.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:center;gap:12px;margin:0 0 16px;flex:none}
.phead .grow{flex:1;min-width:0}.phead h1,.phead .sub{display:none}
.phead:not(:has(.btn,.lsearch)){display:none}
.subtabs{display:none}
.card{border-radius:10px;background:var(--card);border:1px solid var(--stroke);padding:20px;contain:layout paint;position:relative;overflow:hidden}
.card h3{margin:0 0 4px;font:700 14px/1.3 Inter,sans-serif;color:var(--text)}
.card .s{color:var(--text-3);font-size:12.5px}
.k{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-2);display:flex;align-items:center;gap:8px}
.btn{height:34px;border-radius:8px;border:1px solid var(--stroke-2);padding:0 14px;font:600 12.5px Inter,sans-serif;background:var(--field);color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--btn-hover);border-color:#b9c3d8}
.btn.pri{border-color:var(--navy);color:#fff;background:var(--navy)}.btn.pri:hover{background:#3a4a70;border-color:#3a4a70}
.btn.dark{background:var(--field)}
.btn.danger{background:var(--red-bg);border-color:color-mix(in srgb,var(--red) 35%,transparent);color:var(--red-ink)}.btn.danger:hover{background:var(--red-bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-ink);padding:0 8px}.btn.ghost:hover{background:var(--accent-bg)}
.btn.sm{height:30px;padding:0 12px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;pointer-events:none}
.btn .ic{font-size:15px}
.lnk{color:var(--accent-ink);font-weight:600;cursor:pointer;background:none;border:0;padding:0;font-size:12.5px;white-space:nowrap}.lnk:hover{text-decoration:underline}

/* ---------- dashboard ---------- */
.dash{display:flex;flex-direction:column;gap:16px}
.banner{display:none;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--banner-b);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font-size:13px}
.banner b{color:var(--text)}.banner .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kt{padding:20px 22px 18px;cursor:pointer;transition:border-color .12s,box-shadow .12s;contain:none}
.kt:hover{border-color:var(--stroke-2);box-shadow:0 3px 10px rgba(30,45,90,.07)}
.kt .k{margin-bottom:8px}
.kt .big{font:700 34px/1.1 Inter,sans-serif;letter-spacing:-.6px;color:var(--strong);font-variant-numeric:tabular-nums}
.kt .big small{font:600 15px Inter,sans-serif;color:var(--text-3);letter-spacing:0;margin-left:5px}
.kt .d{margin-top:3px;color:var(--text-3);font-size:13px}
.kt.warn .big{color:var(--amber)}.kt.bad .big{color:var(--red)}.kt.good .big{color:var(--green)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.dtri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.ct{margin:0;font:700 14px/1.3 Inter,sans-serif;color:var(--text)}
.cs{margin:1px 0 12px;color:var(--text-3);font-size:12.5px}
.ch{display:flex;align-items:flex-start;gap:10px}.ch .grow{flex:1;min-width:0}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:14px;height:300px;margin-top:6px}
.bc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.bc .bv{font:700 12.5px Inter,sans-serif;color:var(--text);font-variant-numeric:tabular-nums}
.bc i{display:block;width:min(40px,72%);background:var(--bar);border-radius:5px 5px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bc .bx{font:600 12px Inter,sans-serif;color:var(--text-3);margin-top:6px;white-space:nowrap}
.bc.cur i{background:var(--accent)}
.empty-c{height:260px;display:grid;place-items:center;text-align:center;color:var(--text-3);font-size:13px;padding:0 24px}
.chips-f{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chips-f .bk{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 11px;cursor:pointer;border:1px solid color-mix(in srgb,currentColor 26%,transparent);background:color-mix(in srgb,currentColor 9%,transparent)}
.chips-f .bk:hover{background:color-mix(in srgb,currentColor 15%,transparent)}
.chips-f .bk .pt{font-variant-numeric:tabular-nums;opacity:.8}
.dn{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:6px}
.dn .ring{position:relative;width:176px;height:176px;flex:none}
.dn .ring svg{display:block;width:100%;height:100%}
.dn .ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dn .ring b{font:700 34px/1 Inter,sans-serif;color:var(--strong);letter-spacing:-.6px}
.dn .ring span{color:var(--text-3);font-size:12.5px;margin-top:3px}
.lg{width:100%;display:flex;flex-direction:column;gap:8px}
.lg div{display:grid;grid-template-columns:12px minmax(0,1fr) auto 46px;align-items:center;gap:10px;font-size:13px;color:var(--text-2);cursor:default}
.lg div[onclick]{cursor:pointer}.lg div[onclick]:hover span{color:var(--text)}
.lg i{width:12px;height:12px;border-radius:3px;display:block}
.lg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg em{font-style:normal;font-weight:600;color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.lg b{font-weight:500;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums}
.ul{display:flex;flex-direction:column;gap:3px}
.ur{display:grid;grid-template-columns:20px minmax(0,1fr) auto 72px;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.ur[onclick]{cursor:pointer}.ur[onclick]:hover .un{color:var(--text)}
.ur .ui{font-size:18px;color:#7b86a0}
.ur .un{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);font-weight:500}
.ur .up{text-align:right;font:600 12.5px var(--mono);color:var(--text-2);min-width:58px}
.ur .ub{height:6px;border-radius:4px;background:var(--track);overflow:hidden}.ur .ub b{display:block;height:100%;border-radius:4px}
.sr{display:grid;grid-template-columns:20px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--text-2);cursor:pointer}
.sr:first-child{border-top:0}.sr:hover{color:var(--text)}
.sr .ic{font-size:17px}.sr .ok{color:var(--green)}.sr .wr{color:var(--amber)}.sr .bd{color:var(--red)}.sr .nt{color:var(--text-4)}
.sr b{font-weight:600;color:var(--text)}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li:hover b{color:var(--accent-ink)}
.li .n{flex:1;min-width:0}.li .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li .n span{color:var(--text-3);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip2{font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.rec{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.rec:first-child{border-top:0}
.rec:hover .rt b{color:var(--accent-ink)}
.rec .ri{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent-ink);flex:none;font-size:16px}
.rec .rt{flex:1;min-width:0}
.rec .rt b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .rt span{display:block;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .go{color:var(--accent-ink);font-weight:600;font-size:11.5px;flex:none}
.empty2{color:var(--green-ink);font-size:13px;padding:12px 0;display:flex;align-items:center;gap:8px}
.tl div{display:flex;gap:10px;font-size:12.5px;padding:7px 0;color:var(--text-2);align-items:flex-start;border-top:1px solid var(--line)}
.tl div:first-child{border-top:0}
.tl em{font-style:normal;color:var(--text-3);width:42px;flex:none;font-variant-numeric:tabular-nums}
.tl span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotl{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.clickable{cursor:pointer;transition:border-color .15s}.clickable:hover{border-color:var(--stroke-2)}
.more{margin-top:8px;display:inline-block}

/* ---------- tablas ---------- */
.tbl{width:100%}
.thead,.tr{display:grid;grid-template-columns:var(--cols);align-items:center}
.thead>div,.tr>div{padding:0 10px;min-width:0}
.thead{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--stroke);background:var(--head)}
.thead>div{padding-top:10px;padding-bottom:10px}
.tr{border-bottom:1px solid var(--line);min-height:54px;cursor:pointer;transition:background .1s;content-visibility:auto;contain-intrinsic-size:auto 54px}
.tr:hover{background:var(--hover)}
.tr.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.tr.exp{box-shadow:inset 3px 0 0 var(--red)}
.grouphd{display:flex;align-items:center;gap:10px;padding:14px 10px 8px;border-bottom:1px solid var(--line);background:var(--group)}
.grouphd b{font-size:12.5px;font-weight:700;letter-spacing:.1px;color:var(--text)}
.grouphd .gi{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;background:var(--soft)}
.grouphd .gi .ic{font-size:13px}
.grouphd .gc{font-size:10.5px;font-weight:600;color:var(--text-3);background:var(--soft);border-radius:999px;padding:2px 8px}
.grouphd .gcv{color:var(--red-ink);background:var(--red-bg)}
.cellmuted{color:var(--text-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vers{font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ap{display:flex;align-items:center;gap:10px;min-width:0}
.ap .av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font:700 13px Inter,sans-serif;flex:none}
.av.img{background:var(--field);box-shadow:inset 0 0 0 1px var(--stroke);overflow:hidden}
.av.img img{width:100%;height:100%;object-fit:contain;display:block;padding:3px}
.ap .av .ic{font-size:16px}
.ap .t{min-width:0}.ap b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap small{display:block;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.st{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.3px;border-radius:999px;padding:3px 11px 3px 9px;white-space:nowrap;border:1px solid color-mix(in srgb,currentColor 22%,transparent);background:color-mix(in srgb,currentColor 9%,transparent)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.2px;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid color-mix(in srgb,currentColor 22%,transparent);background:color-mix(in srgb,currentColor 9%,transparent);color:var(--grey-ink)}
.tag .ic{font-size:11px}
.tg-crit{color:#b42318}.tg-high{color:#b54708}.tg-med{color:var(--amber-ink)}
.tg-need{color:var(--blue-ink)}.tg-rem{color:var(--green-ink)}.tg-opt{color:var(--grey-ink)}
.fire{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap;background:var(--red-bg);color:var(--red-ink)}
.fire::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.conf{display:inline-flex;align-items:center;gap:5px;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.3px;border-radius:999px;padding:2px 9px;white-space:nowrap;color:var(--red-ink);border:1px solid color-mix(in srgb,var(--red) 35%,transparent);background:var(--red-bg)}
.conf::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--red)}
.tick{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--tick-b);background:var(--field);display:grid;place-items:center;transition:all .1s}
.tick .ic{font-size:11px;color:#fff;opacity:0}
.tick.on{background:var(--accent);border-color:var(--accent)}.tick.on .ic{opacity:1}
.tick.off{opacity:.25;pointer-events:none}

/* ---------- lista + detalle ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;flex:1;min-height:0}
.listcard{display:flex;flex-direction:column;min-height:0;padding:0}
.ltools{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--stroke);flex-wrap:wrap}
.ltools .sp{flex:1}
.lsearch{display:flex;align-items:center;gap:8px;height:32px;border-radius:8px;background:var(--field);border:1px solid var(--stroke-2);padding:0 8px 0 10px;color:var(--text-3);min-width:180px;max-width:280px;transition:border-color .12s,box-shadow .12s}
.lsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,125,225,.14)}
.lsearch .ic{font-size:14px;flex:none}
.lsearch input{background:none;border:0;outline:0;color:var(--text);font:500 12.5px Inter,sans-serif;width:100%;min-width:0}
.lsearch input::placeholder{color:var(--text-4)}
.lsearch .lsx{background:none;border:0;color:var(--text-3);cursor:pointer;font-size:17px;line-height:1;padding:0 2px;display:none}
.lsearch .lsx:hover{color:var(--text)}
.lsearch.has .lsx{display:block}
.chips{display:flex;gap:2px;background:var(--soft);border-radius:9px;padding:3px;overflow-x:auto;max-width:100%}
.chip{border:0;background:transparent;color:var(--text-2);border-radius:7px;padding:5px 11px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.on{background:var(--field);color:var(--text);box-shadow:0 1px 2px var(--shadow)}
.chip .n{color:var(--text-3);margin-left:5px;font-weight:500}
.list{flex:1;overflow:auto}
.list .thead{position:sticky;top:0;z-index:1;background:var(--head)}
.empty{color:var(--text-3);padding:30px 20px;text-align:center}
.detail{display:flex;flex-direction:column;min-height:0}
.detail .ph{margin:auto;text-align:center;color:var(--text-4);font-size:12.5px}
.detail .ph .ic{display:block;font-size:30px;margin:0 auto 10px;opacity:.7}
.dh{display:flex;align-items:center;gap:12px}
.dh .av{width:44px;height:44px;border-radius:12px;font-size:17px}
.detail h2{font:700 17px/1.3 Inter,sans-serif;margin:0;word-break:break-word}
.detail .meta{color:var(--text-3);font-size:12px;margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;padding:12px 14px;border-radius:10px;background:var(--soft-2);border:1px solid var(--stroke)}
.kv small{display:block;color:var(--text-3);font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase}
.kv div div{margin-top:4px;font-weight:600;word-break:break-all;font-variant-numeric:tabular-nums}
.dtext{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text-2);line-height:1.6;overflow-y:auto;flex:1;user-select:text;font-size:12.5px}
.links a{display:inline-block;margin:6px 8px 0 0;color:var(--accent-ink);cursor:pointer;font-size:12px;font-weight:600}
.dacts{display:flex;flex-direction:column;gap:8px;margin-top:14px}.dacts .btn{width:100%}

/* ---------- tráfico de red ---------- */
#p-traffic{--tcols:minmax(0,1.5fr) 88px minmax(0,2.3fr) 1.1fr 1fr}
.tstats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:16px;flex:none}
.tstat{background:var(--field);border:1px solid var(--stroke);border-radius:10px;padding:14px 16px}
.tstat small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-2)}
.tstat b{display:block;font:700 23px/1.1 Inter,sans-serif;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--strong)}
.trhd{display:grid;grid-template-columns:var(--tcols);padding:11px 12px;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--stroke);background:var(--head)}
.trhd>div{padding:0 6px}
.trr{display:grid;grid-template-columns:var(--tcols);align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12.5px;content-visibility:auto;contain-intrinsic-size:auto 37px}
.trr>div{min-width:0;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trr:hover{background:var(--hover)}
.trr.risk{background:var(--field)af0;box-shadow:inset 3px 0 0 var(--amber)}
.trr .pc{display:flex;align-items:center;gap:8px;min-width:0}
.trr .pc b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.trr .dot{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}
.trr .scope{font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.trr .host{color:var(--text)}.trr .ip{color:var(--text-3);font-variant-numeric:tabular-nums}
.tanalysis{flex:none;margin-bottom:16px}
.tan-ok{display:flex;align-items:center;gap:10px;background:var(--green-bg);border:1px solid #bfe8d6;border-radius:10px;padding:12px 14px;color:var(--green-ink);font-size:13px;font-weight:600}
.tan-hd{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;color:var(--amber-ink);margin-bottom:9px}
.tan-hd .ic{color:var(--amber)}
.tan-card{background:var(--field)af0;border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:10px;padding:12px 14px}
.tan-card.crit{background:var(--field)5f4;border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.tan-card.crit .tan-hd{color:var(--red-ink)}.tan-card.crit .tan-hd .ic{color:var(--red)}
.tan-item{display:flex;gap:10px;padding:8px 0;border-top:1px solid rgba(0,0,0,.06);cursor:pointer}
.tan-item:first-child{border-top:0}
.tan-item .tdot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;background:currentColor}
.tan-item .ti{flex:1;min-width:0}
.tan-item .ti b{display:block;font-size:12.5px;color:var(--text)}
.tan-item .ti .d{color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 3px}
.tan-item .ti .w{color:var(--text-2);font-size:12px;line-height:1.5}

/* ---------- ajustes, registro ---------- */
.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.settings .full{grid-column:1/-1}
.settings .card h3{margin-bottom:10px}
.help{color:var(--text-3);margin:0;font-size:12.5px}
.sw{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer;border-bottom:1px solid var(--line)}.sw:last-child{border:0}
.sw .track{width:36px;height:20px;border-radius:10px;background:#c9d1e1;position:relative;flex:none;margin-top:1px;transition:background .15s}
.sw .track::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:all .16s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on .track{background:var(--accent)}.sw.on .track::after{left:18px}
.sw b{font-weight:600}.sw small{display:block;color:var(--text-3);font-size:12px;margin-top:2px}
.projects div{display:flex;align-items:center;gap:10px;background:var(--soft-2);border:1px solid var(--stroke);border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:12.5px}
.projects div span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projects button{all:unset;cursor:pointer;color:var(--text-4);display:inline-flex}.projects button:hover{color:var(--red)}
.field label{display:block;color:var(--text-2);font-size:12px;font-weight:600;margin:12px 0 6px}
.field textarea,.field input{width:100%;background:var(--field);border:1px solid var(--stroke-2);border-radius:8px;color:var(--text);padding:9px 12px;font:13px Inter,sans-serif;resize:vertical;user-select:text;outline:none}
.field textarea:focus,.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,125,225,.14)}
.field input::placeholder,.field textarea::placeholder{color:var(--text-4)}
.listin{display:flex;gap:8px;margin-top:8px}.listin input{flex:1}
.kvline{display:flex;gap:8px;align-items:center;color:var(--text-3);font-size:12px;margin-top:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 14px;cursor:pointer;color:var(--text-2);font-weight:600;font-size:12.5px}
.seg button.on{background:var(--field);color:var(--text);box-shadow:0 1px 2px rgba(30,45,90,.12)}
.checks div{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.checks .ic{font-size:14px;margin-top:1px}
.log{flex:1;min-height:0;background:#131b2f;border:1px solid #1f2a45;border-radius:10px;overflow:auto;padding:16px 18px;font:12px/1.7 var(--mono);user-select:text;color:#cbd5e1}
.log div{white-space:pre-wrap;word-break:break-word}
.l-ok{color:#6ee7b7}.l-warn{color:#fcd34d}.l-err{color:#fda4af}.l-cmd{color:#67e8f9}.l-out{color:#8a96b0}.l-title{color:#c4b5fd}.l-info{color:#cbd5e1}

/* ---------- estado y diálogos ---------- */
.status{display:flex;align-items:center;gap:16px;height:30px;padding:0 28px;flex:none;background:var(--field);border-top:1px solid var(--stroke)}
.status span{flex:1;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{width:240px;height:4px;border-radius:4px;background:var(--track);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .4s}
.pbar.ind i{width:35%;animation:ind 1.2s ease-in-out infinite}
@keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
.modal{position:fixed;inset:0;background:rgba(24,33,58,.45);backdrop-filter:blur(2px);display:none;place-items:center;z-index:50}
.modal.on{display:grid;animation:fade .14s}
.dialog{width:520px;max-height:80vh;display:flex;flex-direction:column;background:var(--field);border:1px solid var(--stroke);border-radius:14px;padding:24px;box-shadow:0 30px 80px -20px rgba(20,30,60,.45)}
.dialog h2{margin:0 0 6px;font:700 18px Inter,sans-serif}
.dialog .body{overflow:auto;color:var(--text-2);margin:8px 0 20px;font-size:13px}
.dialog ul{margin:6px 0;padding-left:18px}.dialog li{margin:3px 0}
.dialog code{background:var(--soft);border-radius:4px;padding:1px 5px;font:12px var(--mono)}
.dialog .warn{background:var(--amber-bg);color:var(--amber-ink);border-radius:10px;padding:10px 14px;margin-top:12px}
.dialog .acts{display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;right:24px;bottom:44px;background:#1f2a44;border:1px solid #33415f;color:#fff;border-radius:10px;padding:12px 16px;max-width:460px;display:none;z-index:60;box-shadow:0 16px 40px -12px rgba(15,25,55,.5);font-size:13px}
.toast.on{display:block;animation:fade .2s}

/* ---------- overlay de progreso con animación (heredado) ---------- */
/* overlay de progreso: aspecto y animaciones ORIGINALES (oscuro, cian) */
.scanfx,.scanner{--text:#e8ecf4;--text-2:#b4bfd6;--text-3:#7f8aa3;--cyan:#22d3ee;color:#e8ecf4}
.scanfx{position:absolute;inset:0;z-index:18;display:none;align-items:center;justify-content:center;overflow:hidden;background:rgba(7,9,16,.82);backdrop-filter:blur(8px)}
.scanfx.on{display:flex;animation:fade .2s}
.scanfx.hidden{display:none}
#fxcanvas{position:absolute;inset:0;width:100%;height:100%}
.fxui{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px}
.fxring{position:relative;width:170px;height:170px}
.fxring svg{transform:rotate(-90deg);filter:drop-shadow(0 0 12px rgba(34,211,238,.5))}
.fxring circle{fill:none;stroke-width:5}.fxtrk{stroke:rgba(255,255,255,.08)}
.fxval{stroke:url(#gg);stroke-linecap:round;stroke-dasharray:0 440;transition:stroke-dasharray .4s ease}
.fxpct{position:absolute;inset:0;display:grid;place-content:center}
.fxpct b{font:800 46px "Inter Display",Inter;background:linear-gradient(180deg,#fff,#7dd3fc);-webkit-background-clip:text;color:transparent}
.fxpct span{color:var(--text-3);font-size:14px;margin-top:-4px}
.fxtitle{font:700 20px "Inter Display",Inter;letter-spacing:.3px}
.fxstatus{color:var(--cyan);font-size:13px;min-height:18px;font-family:var(--mono)}
.fxlog{height:66px;overflow:hidden;width:460px;max-width:80vw;font:11px/1.5 var(--mono);color:var(--text-3);mask-image:linear-gradient(transparent,#000 40%)}
.fxlog div{opacity:.6}.fxlog div:last-child{opacity:1;color:var(--text-2)}
#fxhide{margin-top:4px}


/* ---------- ventana de progreso (escáner cíber) ---------- */
.scanner{position:fixed;inset:0;z-index:45;display:none;overflow:hidden;background:radial-gradient(900px 600px at 50% 30%,rgba(34,211,238,.10),transparent 60%),rgba(6,8,13,.86);backdrop-filter:blur(10px)}
.scanner.on{display:flex;flex-direction:column;animation:fade .25s ease}
.scanner canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.scanner .veil{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.14) 2px 4px);pointer-events:none;mix-blend-mode:overlay}
.sc-top{position:relative;display:flex;align-items:center;gap:12px;padding:20px 26px}
.sc-top .tag{border:1px solid rgba(34,211,238,.4);color:#67e8f9;background:rgba(34,211,238,.08);letter-spacing:1.5px;text-transform:uppercase;font-size:11px}
.sc-top .mini{margin-left:auto}
.sc-mid{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
.radar{position:relative;width:300px;height:300px;flex:none}
.radar .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(34,211,238,.18)}
.radar .ring.r2{inset:34px}.radar .ring.r3{inset:72px}.radar .ring.r4{inset:112px}
.radar .cross::before,.radar .cross::after{content:"";position:absolute;background:rgba(34,211,238,.12)}
.radar .cross::before{left:50%;top:0;bottom:0;width:1px;transform:translateX(-.5px)}
.radar .cross::after{top:50%;left:0;right:0;height:1px;transform:translateY(-.5px)}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(34,211,238,.35),rgba(34,211,238,0) 55%);animation:sweep 2.6s linear infinite;mask:radial-gradient(circle,transparent 8px,#000 9px)}
@keyframes sweep{to{transform:rotate(360deg)}}
.radar .prog{position:absolute;inset:16px}
.radar .prog circle{transition:stroke-dasharray .5s ease}
.radar .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.radar .num b{font:800 56px/1 "Inter Display",Inter;letter-spacing:-2px;background:linear-gradient(180deg,#e8ffff,#67e8f9);-webkit-background-clip:text;color:transparent;text-shadow:0 0 26px rgba(34,211,238,.4)}
.radar .num span{display:block;color:#7fd7e4;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
/* ---------- escena isométrica (PC trabajando) ---------- */
.isostage{position:relative;width:min(560px,74vw);height:320px;display:flex;align-items:center;justify-content:center;flex:none}
.isoscene{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 22px 42px rgba(0,0,0,.55));animation:isobob 4.2s ease-in-out infinite}
.iso-floorglow{fill:rgba(34,211,238,.14);transform-box:fill-box;transform-origin:center;animation:floorpulse 2.6s ease-in-out infinite}
.plat-top{fill:#131c2e;stroke:rgba(34,211,238,.4);stroke-width:1}
.plat-l{fill:#0b111c}.plat-r{fill:#080d16}
.iso-grid{stroke:rgba(34,211,238,.16);stroke-width:1;fill:none}
.tower-top{fill:#223150}.tower-l{fill:#141d31}.tower-r{fill:#0f1626;stroke:rgba(34,211,238,.2);stroke-width:.6}
.led{filter:drop-shadow(0 0 5px currentColor)}
.led0{fill:#34d399;color:#34d399;animation:ledblink 1.3s infinite}
.led1{fill:#22d3ee;color:#22d3ee;animation:ledblink 1.3s infinite .32s}
.led2{fill:#a78bfa;color:#a78bfa;animation:ledblink 1.3s infinite .64s}
.base-top{fill:#223150}.base-l{fill:#141d31}.base-r{fill:#0f1626}
.stand-l{fill:#141d31}.stand-r{fill:#0f1626}
.mon-top{fill:#2a3c60}.mon-l{fill:#0f1626}.mon-r{fill:#0b111c}
.iso-screen{fill:url(#scrG);stroke:rgba(34,211,238,.55);stroke-width:1.2;animation:screenglow 2.3s ease-in-out infinite}
.codebar{stroke:#7dd3fc;stroke-width:2;stroke-linecap:round;opacity:.5;animation:cbpulse 1.8s ease-in-out infinite}
.codebar:nth-of-type(2n){animation-duration:2.4s;animation-delay:.3s}
.codebar:nth-of-type(3n){animation-delay:.7s;stroke:#a5f3fc}
.codebar:nth-of-type(4n){animation-duration:1.3s;animation-delay:.15s}
.iso-scanline{stroke:#dffaff;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 9px #22d3ee)}
.scanline-g{animation:scanup 1.9s linear infinite}
.cube-top{fill:#30456e}.cube-l{fill:#1b2a49}.cube-r{fill:#131f39;stroke:rgba(34,211,238,.28);stroke-width:.5}
.cube{filter:drop-shadow(0 0 7px rgba(34,211,238,.3))}
.c0{animation:cubefloat 2.6s ease-in-out infinite}
.c1{animation:cubefloat 3s ease-in-out infinite .4s}
.c2{animation:cubefloat 2.3s ease-in-out infinite .9s}
@keyframes isobob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes ledblink{0%,100%{opacity:.16}50%{opacity:1}}
@keyframes cubefloat{0%,100%{transform:translateY(3px);opacity:.4}50%{transform:translateY(-16px);opacity:1}}
@keyframes cbpulse{0%,100%{opacity:.16}50%{opacity:.95}}
@keyframes floorpulse{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
@keyframes screenglow{0%,100%{filter:drop-shadow(0 0 8px rgba(34,211,238,.25))}50%{filter:drop-shadow(0 0 20px rgba(34,211,238,.6))}}
@keyframes scanup{0%{transform:translateY(10px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateY(-66px);opacity:0}}
.isohud{position:absolute;right:2%;bottom:6%;width:104px;height:104px}
.isohud .isoring{width:104px;height:104px;display:block;overflow:visible}
.isohud .isoring circle{transition:stroke-dasharray .5s ease}
.isohud .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.isohud .num b{font:800 30px/1 "Inter Display",Inter;letter-spacing:-1px;background:linear-gradient(180deg,#e8ffff,#67e8f9);-webkit-background-clip:text;color:transparent;text-shadow:0 0 18px rgba(34,211,238,.4)}
.isohud .num span{display:block;color:#7fd7e4;font-size:9px;letter-spacing:2px;text-transform:uppercase}
.sc-task{position:relative;font:600 16px "Inter Display",Inter;color:#e8ecf4;text-align:center;max-width:620px;min-height:22px}
.sc-sub{position:relative;color:#7f8aa3;font-size:12.5px;text-align:center}
.sc-blips{position:relative;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:720px;margin-top:6px;min-height:26px}
.blip{font-size:11px;color:#67e8f9;border:1px solid rgba(34,211,238,.3);background:rgba(34,211,238,.06);border-radius:999px;padding:3px 10px;animation:fade .3s ease}
.sc-term{position:relative;margin:0 26px 22px;height:150px;border-radius:14px;border:1px solid rgba(34,211,238,.18);background:rgba(2,6,12,.72);overflow:hidden;font:12px/1.65 var(--mono)}
.sc-term .hd{display:flex;align-items:center;gap:7px;padding:7px 12px;border-bottom:1px solid rgba(34,211,238,.14);color:#7f8aa3;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.sc-term .hd i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399}
.sc-term .body{height:calc(100% - 32px);overflow:auto;padding:8px 14px}
.sc-term .body div{white-space:pre-wrap;word-break:break-word}
.sc-term .l-ok{color:#6ee7b7}.sc-term .l-warn{color:#fcd34d}.sc-term .l-err{color:#fda4af}.sc-term .l-cmd{color:#67e8f9}.sc-term .l-out{color:#6b7689}.sc-term .l-title{color:#c4b5fd}.sc-term .l-info{color:#aab3c5}

.scanner .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#e8ecf4}.scanner .btn:hover{background:rgba(255,255,255,.16)}
.pscopes{display:flex;flex-direction:column;gap:6px}
.pscope{display:flex;gap:12px;align-items:flex-start;padding:11px;border-radius:10px;border:1px solid var(--stroke);background:var(--soft-2);cursor:pointer;transition:border-color .12s,background .12s}
.pscope:hover{border-color:var(--stroke-2);background:var(--btn-hover)}
.pscope .tick{margin-top:1px}.pscope b{display:block;font-size:13px}.pscope small{display:block;color:var(--text-3);font-size:11.5px;margin-top:2px;line-height:1.5}
/* ---------- panel de empresa ---------- */
.kpis5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;flex:none}
.pbatch{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-bg);border:1px solid var(--banner-b);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.pbatch.on{display:flex}
.pbatch b{font-size:13px;color:var(--text);white-space:nowrap}
.pbatch .sp{flex:1}
.selbox{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--tick-b);background:var(--field);display:grid;place-items:center;cursor:pointer;flex:none;transition:all .1s}
.selbox.on{background:var(--accent);border-color:var(--accent)}
.selbox .ic{font-size:11px;color:#fff;opacity:0}
.selbox.on .ic{opacity:1}
.kpi small{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-2)}
.kpi b{display:block;font:700 34px/1.1 Inter,sans-serif;letter-spacing:-.6px;margin-top:10px;color:var(--strong)}
.kpi .d{font-size:12.5px;margin-top:4px}
.cmds{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.nofolder{display:none;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--text-3);text-align:center}
.good{display:flex;align-items:center;gap:10px;color:var(--green-ink);background:var(--green-bg);border-radius:10px;padding:12px 14px;font-weight:600}
@media (max-width:1250px){
  .cmd:focus-within,.pnl .cmd{width:260px}
  .shell{grid-template-columns:212px minmax(0,1fr)}
  .tabs{padding:8px 12px}.brand{padding:18px 18px 14px}
  .top{padding:0 20px}.page{padding:20px 20px 16px}.status{padding:0 20px}
  .split{grid-template-columns:minmax(0,1fr) 300px;gap:14px}
  .kpis,.dgrid,.dtri{gap:14px}.kt{padding:16px 16px 14px}
  .dgrid{grid-template-columns:minmax(0,1fr) 300px}.dtri{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tstats{grid-template-columns:repeat(3,1fr)}.kpis5{grid-template-columns:repeat(3,1fr)}
}
.ur .un small{display:block;color:var(--text-3);font-size:11.5px;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.chips-f .lbl{font-size:12px;color:var(--text-3);align-self:center}

/* ---------- Herramientas ---------- */
.toolbar{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.toolbar .tnote{color:var(--text-3);font-size:12px}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.tool{background:var(--card);border:1px solid var(--stroke);border-radius:10px;padding:18px 18px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .12s,box-shadow .12s,transform .12s;outline:none}
.tool:hover,.tool:focus-visible{border-color:var(--accent);box-shadow:0 6px 18px -10px rgba(47,125,225,.45);transform:translateY(-1px)}
.tool .th{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tool .tic{width:38px;height:38px;border-radius:9px;background:var(--accent-bg);color:var(--accent-ink);display:grid;place-items:center;font-size:19px}

.fa-ek{flex:0 1 420px;min-width:260px}.fa-ek label{display:block;font-size:12.5px;font-weight:600;margin-bottom:8px}.fa-ek small{display:block;font-weight:400;color:var(--text-3);margin-top:2px}
.fa-ekr{display:flex;gap:8px;flex-wrap:wrap}.fa-ekr input{flex:1 1 180px;min-width:0;height:34px;border-radius:8px;border:1px solid var(--stroke-2);background:var(--field);color:var(--text);padding:0 12px;font:500 13px Inter,sans-serif;outline:none;user-select:text}.fa-ekr input:focus{border-color:var(--accent)}

.tgh:first-child{margin-top:0}.tgh small{font-weight:600;margin-left:4px;color:var(--text-4)}
/* 3.10: Filtraciones en una sola columna, cada bloque debajo del anterior y con aire */
.lk-wrap{max-width:900px;gap:36px;padding-bottom:24px}
.lk-grid{grid-template-columns:minmax(0,1fr);gap:36px}

/* 3.11: Anti-ransomware */
#p-ransom>*{flex:none}
.rw-wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:28px;padding-bottom:24px}
.rw-hero{display:flex;gap:20px;align-items:center;padding:30px 34px;border-left:5px solid var(--stroke-2)}
.rw-hero.ok{border-left-color:var(--green)}.rw-hero.warn{border-left-color:var(--amber)}.rw-hero.bad{border-left-color:var(--red);background:var(--red-bg)}
.rw-hi{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-size:27px;flex:none;background:var(--soft);color:var(--text-3)}
.rw-hero.ok .rw-hi{background:var(--green-bg);color:var(--green-ink)}.rw-hero.warn .rw-hi{background:var(--amber-bg);color:var(--amber-ink)}.rw-hero.bad .rw-hi{background:var(--card);color:var(--red-ink)}
.rw-ht{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}.rw-ht b{font-size:19px;letter-spacing:-.2px}.rw-ht>span{color:var(--text-2);font-size:13.5px;line-height:1.55}
.rw-hero.bad .rw-ht b{color:var(--red-ink)}
.rw-ha{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.rw-iso{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:13px;font-weight:600;color:var(--red-ink)}

.rw-card{padding:30px 34px;display:flex;flex-direction:column;gap:18px}
.rw-card h3{margin:0;font-size:17px}.rw-sub{margin:6px 0 0;color:var(--text-3);font-size:13px;line-height:1.6}
.rw-h{display:flex;gap:20px;align-items:flex-start;justify-content:space-between}
.rw-steps{display:flex;flex-direction:column;gap:14px}
.rw-steps>div{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:18px;row-gap:6px;padding:18px 20px;border-radius:12px;background:var(--soft-2);border:1px solid var(--line)}
.rw-steps .n{grid-row:1/3;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font:700 14px Inter,sans-serif;background:var(--accent-bg);color:var(--accent-ink)}
.rw-steps b{font-size:14px}.rw-steps span{font-size:13px;color:var(--text-2);line-height:1.65}
.rw-audit{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--soft-2);font-size:12.5px;color:var(--text-3);line-height:1.6}
.rw-audit.warn{background:var(--amber-bg);color:var(--amber-ink)}.rw-audit .ic{flex:none;margin-top:2px}
.rw-fl{display:flex;flex-direction:column;border:1px solid var(--stroke);border-radius:10px;overflow:hidden}
.rw-f{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}.rw-f:last-child{border:0}
.rw-f .ic{color:var(--text-3);flex:none}.rw-f span{flex:1;min-width:0;overflow-wrap:anywhere}.rw-f em{font-style:normal;font-size:12px;color:var(--text-3);white-space:nowrap}
.rw-err{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:9px;background:var(--amber-bg);color:var(--amber-ink);font-size:12.5px;margin-bottom:8px}

.rw-il{display:flex;flex-direction:column;gap:14px}
.rw-i{border:1px solid var(--stroke);border-left:4px solid var(--stroke-2);border-radius:11px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.rw-i.bad{border-left-color:var(--red)}.rw-i.warn{border-left-color:var(--amber)}.rw-i.test{border-left-color:var(--accent)}.rw-i.done{opacity:.75}
.rw-it{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.rw-it b{font-size:15px}.rw-it span{color:var(--text-3);font-size:12.5px}
.rw-it em{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;color:var(--green-ink);background:var(--green-bg);padding:2px 10px;border-radius:999px}
.rw-id{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rw-id>div{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:9px;background:var(--soft-2)}
.rw-id span{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3)}.rw-id b{font-size:13px;overflow-wrap:anywhere}
.rw-path{display:block;font:12px var(--mono);color:var(--text-2);overflow-wrap:anywhere;margin-top:4px}
.rw-i details summary{cursor:pointer;font-size:12.5px;color:var(--accent-ink);font-weight:600}.rw-i details p{font-size:12.5px;color:var(--text-2);margin:8px 0 0}
.rw-ia{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:1000px){.rw-id{grid-template-columns:repeat(2,minmax(0,1fr))}.rw-hero{flex-wrap:wrap}.rw-ha{justify-content:flex-start}}
/* ---- BlueShieldAA 4.0 ---- */
.v4-soon{display:flex;gap:18px;align-items:flex-start;padding:26px 28px}
.v4-soon .v4-ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-bg,rgba(47,125,225,.12));color:var(--accent,#2f7de1)}

/* ---- tipografía 4.0 ---- */
html,body{font-feature-settings:"cv11","ss01","ss03";font-optical-sizing:auto;text-rendering:optimizeLegibility}
.top h1{font:650 21px/1.2 var(--display);letter-spacing:-.4px}
.kt .big,.kpi b{font-family:var(--display);font-weight:650;letter-spacing:-1px}
.kt .big small{font-family:Inter,sans-serif}

.card h3{letter-spacing:-.15px}
.mono,.vr,code,kbd{font-family:var(--mono);font-feature-settings:"zero","calt"}

/* ---- etiquetas 4.0 ---- */
.st,.tag,.fire,.conf{height:24px;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 Inter,sans-serif;letter-spacing:.05px;border-radius:7px;padding:0 9px 0 7px;white-space:nowrap;
  border:1px solid color-mix(in srgb,currentColor 20%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,currentColor 11%,transparent),color-mix(in srgb,currentColor 6%,transparent));
  box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 45%,transparent)}
.st::before{display:none}
.st svg,.tag svg,.fire svg{width:13px;height:13px;flex:none}
.st-r{color:var(--red-ink)}.st-a{color:var(--amber-ink)}.st-g{color:var(--green-ink)}.st-b{color:var(--blue-ink)}.st-v{color:var(--vio-ink)}.st-n{color:var(--grey-ink)}
.st-r{border-color:color-mix(in srgb,var(--red) 34%,transparent)}
.fire{color:#fff;border:0;background:linear-gradient(135deg,#f04438,#c01048);box-shadow:0 2px 8px -2px rgba(217,45,32,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.conf{margin-left:6px;padding:0 8px}
.tag{padding:0 9px;color:var(--grey-ink)}
.tag .ic{font-size:12px}
.tg-crit{color:var(--red-ink)}.tg-high{color:#b54708}.tg-med{color:var(--amber-ink)}.tg-need{color:var(--blue-ink)}.tg-rem{color:var(--green-ink)}.tg-opt{color:var(--grey-ink)}
.tg-prio{color:#b54708;border-color:color-mix(in srgb,#f79009 40%,transparent);background:linear-gradient(180deg,rgba(247,144,9,.16),rgba(247,144,9,.07))}
.tags{gap:7px}
html.tdark .st,html.tdark .tag,html.tdark .conf{box-shadow:inset 0 1px 0 rgba(255,255,255,.05);background:linear-gradient(180deg,color-mix(in srgb,currentColor 17%,transparent),color-mix(in srgb,currentColor 9%,transparent))}
/* contadores de grupo */
.grouphd .gc{font:600 11px/1 Inter,sans-serif;height:20px;display:inline-flex;align-items:center;padding:0 7px;border-radius:6px}

/* ---- ventana de progreso 4.0: escenas ---- */
.scanner{--mc:#22d3ee;background:radial-gradient(900px 600px at 50% 32%,color-mix(in srgb,var(--mc) 13%,transparent),transparent 62%),radial-gradient(1400px 900px at 50% 120%,rgba(0,0,0,.6),transparent 60%),rgba(6,9,16,.9);transition:background .6s}
.scanner canvas{opacity:.42}
.scanner .veil{background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.12) 2px 4px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
.sc-top .tag{font:700 11px/1 var(--display);letter-spacing:2.2px;height:28px;padding:0 14px;border-radius:999px;border:1px solid color-mix(in srgb,var(--mc) 45%,transparent);color:color-mix(in srgb,var(--mc) 70%,#fff);background:color-mix(in srgb,var(--mc) 10%,transparent);box-shadow:0 0 18px -6px var(--mc)}
.sc-top .sc-sub{font:500 12.5px var(--mono);color:#8792a8}
.isoscene{animation:isobob 5s ease-in-out infinite}
.isoscene [class^="m-"],.isoscene [class*=" m-"]{display:none}
.scene-scan .m-scan,.scene-update .m-update,.scene-winupdate .m-winupdate,.scene-clean .m-clean,.scene-fix .m-fix,.scene-restore .m-restore,.scene-done .m-done{display:inline}
.iso-floorglow{fill:color-mix(in srgb,var(--mc) 22%,transparent)}
.plat-top{stroke:color-mix(in srgb,var(--mc) 45%,transparent);transition:stroke .6s}
.iso-grid{stroke:color-mix(in srgb,var(--mc) 18%,transparent)}
.iso-screen{stroke:color-mix(in srgb,var(--mc) 60%,transparent)}
.led1{fill:var(--mc);color:var(--mc)}
/* radar y puntos */
.rad-ring{fill:none;stroke:color-mix(in srgb,var(--mc) 22%,transparent);stroke-width:.5}
.rad-sweep{fill:url(#sweepG)}
.dot{fill:rgba(148,163,184,.28);transition:fill .4s}
.dot.ok{fill:#34d399;filter:drop-shadow(0 0 2px #34d399)}
.dot.run{fill:var(--mc);animation:dotpulse 1s ease-in-out infinite}
@keyframes dotpulse{50%{opacity:.25}}
.pulse-ring{fill:none;stroke:var(--mc);stroke-width:.7;transform-box:fill-box;transform-origin:center;animation:pring 2.4s ease-out infinite}
.pulse-ring.p2{animation-delay:1.2s}
@keyframes pring{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(1.55)}}
/* nube y descarga */
.cloud path{fill:#16233d;stroke:var(--mc);stroke-width:1}
.cl-arrow path{fill:none;stroke:#e0f7ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;animation:clbob 1.3s ease-in-out infinite}
.cl-win rect{fill:#e0f7ff}
@keyframes clbob{50%{transform:translateY(2px)}}
.beam{fill:url(#beamG);animation:beamfl 1.3s ease-in-out infinite}
@keyframes beamfl{50%{opacity:.55}}
.beam-dash{stroke:var(--mc);stroke-width:1;stroke-dasharray:2 5;animation:dashdown .6s linear infinite}
@keyframes dashdown{to{stroke-dashoffset:-7}}
.pkt path{fill:#e0f7ff;filter:drop-shadow(0 0 4px var(--mc))}
.land{fill:none;stroke:var(--mc);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:land 1.3s ease-out infinite}
@keyframes land{0%{opacity:.9;transform:scale(.3)}100%{opacity:0;transform:scale(1.25)}}
/* pantalla */
.scr-chrome rect{fill:color-mix(in srgb,var(--mc) 14%,transparent)}.scr-chrome circle{fill:color-mix(in srgb,var(--mc) 55%,transparent)}
.lens circle{fill:color-mix(in srgb,var(--mc) 12%,transparent);stroke:#e0f7ff;stroke-width:2.4}.lens path{stroke:#e0f7ff;stroke-width:3.4;stroke-linecap:round}
.s-arrow path{fill:none;stroke:#e0f7ff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;animation:arrowdl 1.3s ease-in-out infinite}
.s-arrow path+path{animation:none;stroke:color-mix(in srgb,var(--mc) 70%,#fff)}
@keyframes arrowdl{0%{transform:translateY(-6px);opacity:.3}60%{transform:translateY(2px);opacity:1}100%{transform:translateY(2px);opacity:0}}
.s-win rect{fill:#7dd3fc;animation:winpulse 1.6s ease-in-out infinite}.s-win rect:nth-child(2){animation-delay:.2s}.s-win rect:nth-child(3){animation-delay:.4s}.s-win rect:nth-child(4){animation-delay:.6s}
@keyframes winpulse{50%{fill:#e0f7ff}}
.s-broom{stroke:#ddd6fe;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;transform-origin:50px 22px;animation:sweepbroom 1s ease-in-out infinite alternate}
@keyframes sweepbroom{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.bar .trk{fill:rgba(255,255,255,.1)}
.bar .fill{fill:var(--mc);filter:drop-shadow(0 0 3px var(--mc));transition:width .5s ease}
.bar .ind{fill:var(--mc);opacity:0}
.bar-ind .bar .fill{opacity:.35}
.bar-ind .bar .ind{opacity:1;animation:indbar 1.2s ease-in-out infinite}
@keyframes indbar{0%{transform:translateX(0)}50%{transform:translateX(54px)}100%{transform:translateX(0)}}
.s-tog .tl{fill:rgba(255,255,255,.18)}
.s-tog .tt{fill:rgba(255,255,255,.12);animation:togtrack 3.6s ease-in-out infinite}
.s-tog .tk{fill:#e2e8f0;animation:togknob 3.6s ease-in-out infinite}
.s-tog .t2,.s-tog .k2{animation-delay:.6s}.s-tog .t3,.s-tog .k3{animation-delay:1.2s}
@keyframes togknob{0%,15%{transform:translateX(0)}30%,85%{transform:translateX(14px);fill:#fff}100%{transform:translateX(0)}}
@keyframes togtrack{0%,15%{fill:rgba(255,255,255,.12)}30%,85%{fill:#10b981}100%{fill:rgba(255,255,255,.12)}}
.s-clock circle{fill:none;stroke:#fde68a;stroke-width:3.4}.s-clock path{fill:none;stroke:#fde68a;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.s-ok circle{fill:rgba(52,211,153,.16);stroke:#34d399;stroke-width:3}
.s-ok path{fill:none;stroke:#d1fae5;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:drawok .6s .15s ease-out forwards}
@keyframes drawok{to{stroke-dashoffset:0}}
.flash{fill:#fff;opacity:0}
.scene-restore .flash{animation:flash 2.4s ease-out infinite}
@keyframes flash{0%,88%{opacity:0}90%{opacity:.75}100%{opacity:0}}
/* escudo */
.shield{fill:url(#shieldG);stroke:var(--mc);stroke-width:1.4;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--mc) 60%,transparent));transform-box:fill-box;transform-origin:center;animation:shieldbreath 2.6s ease-in-out infinite}
.shield-chk{fill:none;stroke:color-mix(in srgb,var(--mc) 60%,#fff);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;animation:shchk 2.6s ease-in-out infinite;opacity:.8}
@keyframes shieldbreath{50%{transform:scale(1.04);opacity:.85}}
@keyframes shchk{0%{stroke-dashoffset:50}40%,100%{stroke-dashoffset:0}}
/* copias del monitor */
.ghost{opacity:.35;animation:ghost 2.4s ease-out infinite;filter:drop-shadow(0 0 3px var(--mc)) sepia(.6) saturate(2.2)}
.ghost.g2{animation-delay:.25s}
.ghost-scr{fill:rgba(251,191,36,.18);stroke:rgba(251,191,36,.6);stroke-width:.8}
@keyframes ghost{0%{opacity:0;transform:translate(6px,3.5px)}35%{opacity:.7}70%,100%{opacity:.35;transform:none}}
#pcMon .ghost-scr{display:inline}
/* papelera y hojas */
.sheet path{fill:#ede9fe;stroke:#a78bfa;stroke-width:.5;filter:drop-shadow(0 0 3px rgba(167,139,250,.7))}
.bin-body{fill:url(#binG);stroke:color-mix(in srgb,var(--mc) 55%,transparent);stroke-width:.7}
.bin-rib{stroke:rgba(167,139,250,.45);stroke-width:.8;fill:none}
.bin-mouth{fill:#070b14;stroke:color-mix(in srgb,var(--mc) 60%,transparent);stroke-width:.7}
.bin-lid ellipse{fill:#2a3c60;stroke:var(--mc);stroke-width:.7}.bin-lid rect{fill:#30456e}
.bin-shadow{fill:rgba(0,0,0,.35)}
/* textos de debajo */
.sc-task{font:600 18px/1.3 var(--display);letter-spacing:-.2px;max-width:720px}
.sc-subtask{display:none;align-items:center;gap:12px;min-height:22px;font:500 12.5px var(--mono);color:color-mix(in srgb,var(--mc) 55%,#e2e8f0)}
.sc-subtask.on{display:flex}
.sc-subtask i{display:block;width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.sc-subtask b{display:block;height:100%;background:var(--mc);border-radius:4px;box-shadow:0 0 8px var(--mc);transition:width .5s ease}
.sc-subtask.ind b{animation:subind 1.2s ease-in-out infinite}
@keyframes subind{0%{transform:translateX(-100%)}100%{transform:translateX(480%)}}
.sc-sub{font:500 12px Inter,sans-serif;color:#7f8aa3}
/* fichas */
.sc-blips{gap:8px;margin-top:10px}
.blip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 9px;border-radius:8px;font:600 11.5px/1 Inter,sans-serif;letter-spacing:.1px;color:#cbd5e1;border:1px solid rgba(148,163,184,.22);background:rgba(15,23,42,.55);backdrop-filter:blur(6px);animation:blipin .35s cubic-bezier(.2,.8,.2,1)}
.blip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.blip.b-ok{color:#6ee7b7;border-color:rgba(52,211,153,.35);background:rgba(16,185,129,.1)}
.blip.b-run{color:color-mix(in srgb,var(--mc) 70%,#fff);border-color:color-mix(in srgb,var(--mc) 50%,transparent);background:color-mix(in srgb,var(--mc) 12%,transparent);box-shadow:0 0 16px -6px var(--mc)}
.blip.b-wait{color:#7f8aa3}
.blip.b-more{color:#7f8aa3}
.blip .spin{width:11px;height:11px;border-radius:50%;border:2px solid color-mix(in srgb,var(--mc) 30%,transparent);border-top-color:var(--mc);animation:sweep .8s linear infinite}
.blip .wt{width:7px;height:7px;border-radius:50%;border:1.5px solid #64748b}
@keyframes blipin{from{opacity:0;transform:translateY(4px) scale(.96)}}
/* anillo de porcentaje */
#scRing{stroke:var(--mc)!important;filter:drop-shadow(0 0 6px var(--mc))!important;transition:stroke-dasharray .5s ease,stroke .6s}
.isohud .num b{font:700 30px/1 var(--display);background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--mc) 70%,#fff));-webkit-background-clip:text;color:transparent;text-shadow:none}
.isohud .num span{color:color-mix(in srgb,var(--mc) 60%,#cbd5e1)}
/* consola en vivo */
.sc-term{height:200px;border-color:color-mix(in srgb,var(--mc) 22%,transparent);background:linear-gradient(180deg,rgba(3,7,14,.86),rgba(2,5,10,.92));box-shadow:0 -10px 40px -20px var(--mc),inset 0 1px 0 rgba(255,255,255,.04);font:12px/1.7 var(--mono)}
.sc-term .hd{font:600 10.5px var(--display);letter-spacing:1.6px}
.sc-term .hd i{background:var(--mc);box-shadow:0 0 8px var(--mc);animation:dotpulse 1.4s ease-in-out infinite}
.sc-term .body div{display:flex;gap:12px;white-space:normal}
.sc-term .body .tm{flex:none;color:#3f4a5e;font-variant-numeric:tabular-nums}
.sc-term .body .msg{white-space:pre-wrap;word-break:break-word;min-width:0}
.sc-term .l-cmd .msg{color:color-mix(in srgb,var(--mc) 75%,#fff)}
.sc-term .l-out .msg{color:#8b95a8;padding-left:14px;border-left:1px solid rgba(148,163,184,.15)}
.sc-term .l-title{margin-top:6px}.sc-term .l-title .msg{color:#c4b5fd;font-weight:700}
.sc-term .l-ok .msg{color:#6ee7b7}.sc-term .l-err .msg{color:#fda4af}.sc-term .l-warn .msg{color:#fcd34d}.sc-term .l-info .msg{color:#aab3c5}
@media (prefers-reduced-motion:reduce){.isoscene *,.scanner canvas{animation:none!important}}
#sweepG stop,#beamG stop,#shieldG stop{stop-color:var(--mc)}

.isostage{width:min(640px,78vw);height:350px}
.crashbox{font:12px/1.5 var(--mono);background:var(--soft);border:1px solid var(--stroke);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;color:var(--red-ink)}

/* ---- Procesos ---- */
.pr-card{padding:0;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
.pr-hd,.pr-row{display:grid;grid-template-columns:minmax(0,2.6fr) 70px 110px 72px 90px 120px 54px 110px;gap:10px;align-items:center;padding:0 16px}
.pr-hd{height:38px;font:700 10.5px/1 Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);background:var(--head);border-bottom:1px solid var(--line)}
.pr-list{flex:1;overflow:auto}
.pr-row{min-height:46px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.pr-row:hover{background:var(--hover)}.pr-row.open{background:var(--sel)}
.pr-row.f-r{box-shadow:inset 3px 0 0 var(--red)}.pr-row.f-a{box-shadow:inset 3px 0 0 var(--amber)}
.pr-n{display:flex;align-items:center;gap:10px;min-width:0;position:relative}
.pr-n div{min-width:0}.pr-n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-n small{display:block;color:var(--text-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-av{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font:700 12px var(--display)}
.pr-br{position:absolute;width:10px;height:14px;border-left:1.5px solid var(--stroke-2);border-bottom:1.5px solid var(--stroke-2);border-bottom-left-radius:4px;transform:translate(-14px,-6px)}
.pr-u{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.pr-row .mono{font-family:var(--mono);font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.pr-det{padding:14px 20px 16px 52px;background:var(--soft-2);border-bottom:1px solid var(--line);display:grid;gap:8px}
.pr-why{display:flex;gap:8px;align-items:center;color:var(--red-ink);font-weight:600}
.pr-kv{display:grid;grid-template-columns:140px 1fr;gap:10px;font-size:12.5px}.pr-kv span{color:var(--text-3)}
.pr-kv code{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-all;color:var(--text-2)}
.pr-acts{display:flex;gap:8px;margin-top:6px;align-items:center}.pr-acts .sp{flex:1}
#prView{margin-left:10px}

/* ---- entorno aislado ---- */
.fa-sb{padding:0 22px}
.sb-card{border:1px solid var(--stroke);border-radius:14px;padding:18px 20px;margin:4px 0 18px;background:linear-gradient(180deg,var(--soft-2),var(--card))}
.sb-card.run{border-color:color-mix(in srgb,var(--accent) 40%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 10%,transparent)}
.sb-h{display:flex;gap:14px;align-items:flex-start}
.sb-h b{display:block;font:650 15px var(--display);margin-bottom:3px}.sb-h span{color:var(--text-2);font-size:12.5px;line-height:1.5}
.sb-ic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-bg);color:var(--accent-ink)}.sb-ic .ic{font-size:19px}
.sb-points{margin:12px 0 4px 52px;padding:0;list-style:none;display:grid;gap:6px;font-size:12.5px;color:var(--text-2)}
.sb-points li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
.sb-go{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:12.5px;color:var(--text-3)}.sb-go .sp{flex:1}
.sb-steps{list-style:none;margin:14px 0 8px 52px;padding:0;display:grid;gap:6px;font-size:12.5px;color:var(--text-3)}
.sb-steps li::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;border:2px solid var(--stroke-2);margin-right:9px;vertical-align:-1px}
.sb-steps li.d{color:var(--text-2)}.sb-steps li.d::before{background:var(--green);border-color:var(--green)}
.sb-steps li.on{color:var(--text);font-weight:600}.sb-steps li.on::before{border-color:var(--accent);border-top-color:transparent;animation:sweep .8s linear infinite}
.sb-bar{height:5px;border-radius:5px;background:var(--track);margin:6px 0 14px 52px;overflow:hidden}.sb-bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .8s ease}
.sb-view{border-radius:10px;overflow:hidden;background:#0b1220;aspect-ratio:16/9;display:grid;place-items:center;border:1px solid var(--stroke)}
.sb-view img{width:100%;height:100%;object-fit:contain;display:block;animation:fade .3s}
.sb-noimg{color:#7f8aa3;font-size:12.5px}
.sb-thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}
.sb-th{flex:none;width:118px;border:2px solid transparent;border-radius:8px;padding:0;background:none;cursor:pointer;position:relative;overflow:hidden}
.sb-th img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}.sb-th.on{border-color:var(--accent)}
.sb-th span{position:absolute;right:4px;bottom:4px;font:600 10px var(--mono);background:rgba(0,0,0,.65);color:#fff;border-radius:4px;padding:1px 5px}
.sb-v{margin:14px 0}
.sb-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;margin-top:16px}
.sb-grid h4{margin:0 0 10px;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3)}
.sb-pr{padding:7px 0;border-bottom:1px solid var(--line)}
.sb-pr .n{display:flex;align-items:center;gap:8px;position:relative}.sb-pr .n b{font-weight:600}
.sb-pr .t{font:500 11px var(--mono);color:var(--text-4)}
.sb-pr code{display:block;font:11px/1.45 var(--mono);color:var(--text-3);margin-top:3px;white-space:pre-wrap;word-break:break-all}
.sb-pr small{display:block;color:var(--red-ink);font-size:11.5px;margin-top:3px}
.sb-pr.peligroso .n b{color:var(--red-ink)}.sb-pr.sospechoso .n b{color:var(--amber-ink)}
.sb-line{display:block;font:11.5px/1.5 var(--mono);color:var(--text-2);word-break:break-all;padding:3px 0}.sb-line.bad{color:var(--red-ink);font-weight:600}

/* ---- Limpieza: explorador de espacio ---- */
#p-clean{gap:14px}
.cl-drive{padding:16px 18px;display:grid;gap:14px}
.cl-dvs{display:flex;gap:10px;flex-wrap:wrap}
.cl-dv{display:grid;gap:5px;min-width:200px;text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--stroke);background:var(--field);cursor:pointer}
.cl-dv.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.cl-dv b{font:650 13px var(--display)}.cl-dv small{color:var(--text-3);font-size:11.5px}
.cl-dv i{display:block;height:6px;border-radius:6px;background:var(--track);overflow:hidden}.cl-dv em{display:block;height:100%;border-radius:6px}
.cl-prog{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;background:var(--soft-2);border:1px solid var(--line)}
.cl-prog>div{flex:1;min-width:0}.cl-prog b{display:block;font-weight:600}.cl-prog small{display:block;color:var(--text-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-prog.done>.ic{color:var(--green)}
.cl-spin{flex:none;width:18px;height:18px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:sweep .8s linear infinite}
.cl-tabs{display:flex;align-items:center;gap:14px}
.cl-leg{margin-left:auto;display:flex;gap:14px;font-size:11.5px;color:var(--text-3)}.cl-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.cl-body{flex:1;min-height:0;display:flex;flex-direction:column}
.cl-split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;flex:1;min-height:0}
.cl-list{padding:0;overflow:auto;min-height:0}
.cl-split>.cl-list{display:flex;flex-direction:column}
.cl-side{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;min-height:0}
.cl-recs{display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.cl-recs .cl-list{overflow:visible;flex:none;min-height:auto}
.cl-lh{padding:10px 16px;font:700 10.5px/1 Inter,sans-serif;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--line);background:var(--head)}
.cl-rh{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.cl-rh>div{flex:1}
.cl-rh b{display:block;font:650 14px var(--display)}.cl-rh small{display:block;color:var(--text-3);font-size:12px;margin-top:3px;line-height:1.45}
.cl-crumbs{display:flex;align-items:center;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cl-crumbs button{border:0;background:none;color:var(--text-2);cursor:pointer;padding:3px 6px;border-radius:6px;font:inherit}.cl-crumbs button:hover{background:var(--hover)}
.cl-crumbs button.on{color:var(--text);font-weight:650}.cl-crumbs i{color:var(--text-4);font-style:normal}.cl-crumbs .sp{flex:1}
.cl-crumbs .cl-up{border:1px solid var(--stroke);width:26px;height:26px;padding:0;margin-right:6px}
.cl-why{padding:0 16px;font-size:12px;color:var(--text-2)}.cl-why:not(:empty){padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.cl-row{display:grid;grid-template-columns:26px 28px minmax(0,1fr) 110px 82px 240px;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px}
.cl-row:hover{background:var(--hover)}.cl-row.focus{background:var(--sel)}.cl-row.rest{cursor:default;opacity:.75}
.cl-ck input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.cl-ic{display:grid;place-items:center}.cl-ic .ic{font-size:18px}.cl-ic.big .ic{font-size:26px}
.cl-nm{min-width:0}.cl-nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cl-nm small{display:block;color:var(--text-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-bar{height:8px;border-radius:8px;background:var(--track);overflow:hidden}.cl-bar i{display:block;height:100%;border-radius:8px;opacity:.85}
.cl-sz{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cl-bd{display:flex;justify-content:flex-end}
.cl-tm{padding:0;display:flex;flex-direction:column;min-height:260px}
.cl-map{position:relative;flex:1;margin:10px;min-height:220px}
.cl-tile{position:absolute;border-radius:6px;overflow:hidden;cursor:pointer;padding:6px 8px;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 92%,#fff),color-mix(in srgb,var(--c) 78%,#000));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:filter .15s}
.cl-tile:hover{filter:brightness(1.12)}.cl-tile.focus{box-shadow:inset 0 0 0 2px #fff,0 0 0 2px var(--text)}
.cl-tile.dir::after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-right:2px solid rgba(255,255,255,.7);border-top:2px solid rgba(255,255,255,.7);transform:rotate(45deg)}
.cl-tile b{display:block;font:600 11.5px Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.cl-tile small{display:block;font:500 10.5px var(--mono);opacity:.9}
.cl-det{padding:16px 18px;display:grid;gap:9px;align-content:start}
.cl-dh{display:flex;gap:12px;align-items:center}.cl-dh b{display:block;font:650 14px var(--display);word-break:break-all}.cl-dh small{display:block;color:var(--text-3);font-size:11px;word-break:break-all}
.cl-dk{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2)}.cl-dk b{color:var(--text)}
.cl-dv2{display:grid;gap:6px;padding:10px 12px;border-radius:10px;background:var(--soft-2);border:1px solid var(--line)}.cl-dv2 p{margin:0;font-size:12.5px;color:var(--text-2);line-height:1.5}.cl-dv2 .st{justify-self:start}
.cl-da{display:flex;gap:8px;flex-wrap:wrap}
.cl-empty{display:grid;justify-items:center;gap:8px;padding:50px 20px;text-align:center}.cl-empty .ic{font-size:30px;color:var(--accent)}.cl-empty b{font:650 16px var(--display)}.cl-empty span{color:var(--text-3)}
.cl-sel:empty{display:none}
.cl-selbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;background:var(--navy);color:#fff;box-shadow:0 10px 30px -10px var(--shadow)}
.cl-selbar .sp{flex:1}.cl-selbar small{color:rgba(255,255,255,.65);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-selbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}.cl-selbar .btn.danger{background:#d92d20;border-color:#d92d20}
.cl-mlist{display:grid;gap:4px;max-height:180px;overflow:auto}.cl-mlist code{font:11px var(--mono);color:var(--text-2);word-break:break-all}

/* ---- anillo de porcentaje ---- */
#scRing{transition:stroke .6s!important}
.isohud .isoring{transform-origin:50% 50%;transform-box:fill-box}
.isohud .isoring circle:first-child{stroke:color-mix(in srgb,var(--mc) 16%,transparent)}
.isohud.ind .isoring{animation:hudspin 1.15s linear infinite}
@keyframes hudspin{to{transform:rotate(360deg)}}
.isohud .num b{font-variant-numeric:tabular-nums;transition:font-size .2s}
.isohud.ind .num span{letter-spacing:1px}

/* ---- 4.1 anti-ransomware: modos y contención ---- */
.rw-modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rw-m{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:12px;border:1.5px solid var(--stroke);background:var(--soft-2);transition:border-color .15s,background .15s}
.rw-m b{display:flex;gap:8px;align-items:center;font-size:14px}.rw-m span{font-size:12.5px;color:var(--text-2);line-height:1.55}
.rw-m:hover{border-color:var(--stroke-2)}.rw-m.on{border-color:var(--accent);background:var(--accent-bg)}.rw-m.on b{color:var(--accent-ink)}
.rw-m.danger.on{border-color:var(--red);background:var(--red-bg)}.rw-m.danger.on b{color:var(--red-ink)}
.rw-m[disabled]{opacity:.55;cursor:default}
.sw.dim{opacity:.7}
.rw-why{margin:0;font-size:13px;color:var(--text-2);line-height:1.55}
.rw-cul{display:flex;flex-direction:column;gap:2px}.rw-cul small{font-size:12px;color:var(--text-3)}
.ct-card{padding:28px 32px;display:flex;flex-direction:column;gap:20px;border:1.5px solid var(--red);background:linear-gradient(180deg,var(--red-bg),var(--card) 140px)}
.ct-top{display:flex;gap:16px;align-items:center}.ct-top>div{display:flex;flex-direction:column;gap:4px}
.ct-top b{font-size:19px;color:var(--red-ink);letter-spacing:-.2px}.ct-top span{font-size:13px;color:var(--text-2)}
.ct-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:var(--red);color:#fff;flex:none;animation:ctPulse 2.4s ease-in-out infinite}
@keyframes ctPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35)}50%{box-shadow:0 0 0 10px rgba(220,38,38,0)}}
.ct-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ct-grid>div{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.ct-grid span{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3)}.ct-grid b{font-size:14px;overflow-wrap:anywhere}
.ct-h{margin:0 0 10px;font-size:15px}
.ct-rows{display:flex;flex-direction:column;border:1px solid var(--stroke);border-radius:12px;overflow:hidden;background:var(--card)}
.ct-row{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}.ct-row:last-child{border:0}
.ct-row>div{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}.ct-row b{font-size:13.5px}.ct-row>div>span{font-size:12.5px;color:var(--text-2);line-height:1.55}
.ct-dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--amber-bg);color:var(--amber-ink);font-size:14px}
.ct-row.ok .ct-dot{background:var(--green-bg);color:var(--green-ink)}.ct-row.opt .ct-dot{background:var(--soft);color:var(--text-3)}
.ct-act{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--text-2)}
.ct-ck{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--text-2);cursor:pointer;margin-top:4px}

.tsv.t-v{background:var(--vio-bg);color:var(--vio-ink)}.tsv.t-b{background:var(--blue-bg);color:var(--blue-ink)}.tsv.t-n{background:var(--grey-bg);color:var(--grey-ink)}
